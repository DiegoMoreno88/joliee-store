<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Joliee Store - Catálogo Oficial</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #800020;
      --primary-hover: #5d0017;
      --bg: #f8f6f6;
      --surface: #ffffff;
      --text: #2b2b2b;
      --text-muted: #666666;
      --border: #e8e3e3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; transition: background-color 0.3s, color 0.3s; }
    
    header { background: var(--surface); padding: 15px 25px; border-bottom: 1px solid var(--border); position: relative; display: flex; align-items: center; justify-content: space-between; transition: background-color 0.3s; }
    .header-brand { display: flex; align-items: center; gap: 15px; }
    .logo-img { height: 75px; width: 75px; border-radius: 10px; object-fit: cover; display: none; border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .store-info { display: flex; flex-direction: column; text-align: left; }
    .store-name { font-size: 24px; font-weight: 700; color: var(--primary); line-height: 1.2; }
    .store-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .admin-trigger { background: none; border: none; font-size: 24px; cursor: pointer; padding: 5px; z-index: 10; }

    .container { max-width: 1000px; margin: 0 auto; padding: 20px 15px; }
    .search-box { width: 100%; padding: 12px 18px; border-radius: 25px; border: 1px solid var(--border); font-size: 15px; outline: none; margin-bottom: 15px; background: var(--surface); color: var(--text); }
    .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
    .cat-chip { padding: 8px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; font-size: 14px; cursor: pointer; white-space: nowrap; font-weight: 500; color: var(--text); }
    .cat-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; }
    .card { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; position: relative; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
    .card-img-container { position: relative; width: 100%; height: 210px; background: #eee; }
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-status { position: absolute; top: 8px; left: 8px; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; z-index: 2; }
    .badge-available { background: #25d366; color: white; }
    .badge-soldout { background: #ff4d4d; color: white; }
    
    .card-content { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-cat { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; color: var(--text); }
    .card-price { font-size: 18px; font-weight: 700; color: var(--primary); }
    
    .btn-ws { background: #25d366; color: white; text-decoration: none; padding: 12px; border-radius: 8px; text-align: center; font-weight: 600; font-size: 15px; display: block; border: none; width: 100%; cursor: pointer; }
    .btn-ws.disabled { background: #ccc; pointer-events: none; }
    
    .pagination-container { margin-top: 35px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .pagination-info-row { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 480px; font-size: 14px; color: var(--text-muted); padding: 0 4px; }
    .per-page-select { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; color: var(--text); outline: none; cursor: pointer; font-weight: 500; }
    .pagination-bar { display: inline-flex; background: #e8e8e8; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    .page-btn { padding: 8px 16px; border: none; background: #e8e8e8; border-right: 1px solid #d0d0d0; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; transition: background 0.2s, color 0.2s; display: flex; align-items: center; justify-content: center; min-width: 42px; min-height: 38px; }
    .page-btn:last-child { border-right: none; }
    .page-btn:hover:not(.active):not(:disabled) { background: #dcdcdc; }
    .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .page-btn:disabled { color: #aaa; cursor: not-allowed; background: #e0e0e0; }
    .page-ellipsis { padding: 8px 12px; background: #e8e8e8; border-right: 1px solid #d0d0d0; font-size: 14px; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
    .modal-content { background: var(--surface); color: var(--text); width: 100%; max-width: 580px; max-height: 90vh; border-radius: 16px; overflow-y: auto; padding: 25px; position: relative; border: 1px solid var(--border); }
    .close-btn { position: absolute; right: 20px; top: 20px; font-size: 26px; border: none; background: none; cursor: pointer; color: var(--text-muted); z-index: 10; }
    
    .admin-tabs { display: flex; gap: 10px; border-bottom: 1px solid var(--border); margin-bottom: 15px; margin-top: 15px; overflow-x: auto; }
    .tab-btn { padding: 8px 14px; border: none; background: none; cursor: pointer; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab-btn.active { color: var(--primary); border-color: var(--primary); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: var(--bg); color: var(--text); }
    .or-divider { text-align: center; font-size: 11px; color: var(--text-muted); margin: 4px 0; font-weight: 600; }
    .btn-submit { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 10px; }
    .btn-cancel { background: #666; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 5px; display: none; }
    .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--border); font-size: 14px; gap: 10px; color: var(--text); }
    .admin-actions { display: flex; gap: 5px; }
    .btn-edit { background: #007bff; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .btn-del { background: #ff4d4d; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    
    .detail-img-box { position: relative; width: 100%; background: #f0f0f0; border-radius: 12px; overflow: hidden; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
    .detail-img { width: 100%; max-height: 380px; object-fit: contain; display: block; margin: 0 auto; }
    .detail-cat { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
    .detail-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .detail-price { font-size: 24px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .detail-desc-box { background: var(--bg); padding: 12px; border-radius: 8px; font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; border: 1px solid var(--border); }
    
    .preset-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 15px; }
    .btn-preset { padding: 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--bg); color: var(--text); text-align: center; }
    .color-pickers-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
    .color-picker-item { display: flex; flex-direction: column; gap: 4px; }
    .color-picker-item input[type="color"] { width: 100%; height: 36px; border: none; border-radius: 6px; cursor: pointer; background: transparent; }
  </style>
</head>
<body>

  <header>
    <div class="header-brand">
      <img id="store-logo" class="logo-img" src="" alt="Logo">
      <div class="store-info">
        <div id="display-title" class="store-name">Joliee Store</div>
        <div id="display-sub" class="store-sub">Catálogo Oficial</div>
      </div>
    </div>
    <button class="admin-trigger" onclick="openAdmin()" title="Panel de Administración">⚙️</button>
  </header>

  <div class="container">
    <input type="text" id="search-input" class="search-box" placeholder="Buscar por producto..." oninput="onSearchOrCatChange()">
    <div class="categories-bar" id="cat-chips"></div>
    <div class="products-grid" id="catalog-grid"></div>

    <div class="pagination-container" id="pagination-section">
      <div class="pagination-info-row">
        <span id="pagination-info-text">Mostrando 1–24 de 132</span>
        <select class="per-page-select" id="per-page-select" onchange="changePerPage(this.value)">
          <option value="12">Mostrar 12</option>
          <option value="24" selected>Mostrar 24</option>
          <option value="48">Mostrar 48</option>
          <option value="all">Mostrar Todos</option>
        </select>
      </div>
      <div class="pagination-bar" id="pagination-controls"></div>
    </div>
  </div>

  <div class="modal" id="product-detail-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeProductDetail()">&times;</button>
      <div class="detail-img-box">
        <div id="detail-badge" style="position:absolute; top:10px; left:10px; z-index:5;"></div>
        <img id="detail-img" class="detail-img" src="" alt="Producto">
      </div>
      <div id="detail-cat" class="detail-cat"></div>
      <h2 id="detail-title" class="detail-title"></h2>
      <div id="detail-price" class="detail-price"></div>
      <div style="font-size: 13px; font-weight: 600; margin-bottom: 6px;">Descripción:</div>
      <div id="detail-desc" class="detail-desc-box"></div>
      <a id="detail-ws-btn" href="#" class="btn-ws" target="_blank">Pedir por WhatsApp</a>
    </div>
  </div>

  <div class="modal" id="admin-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeAdmin()">&times;</button>
      <h2>⚙️ Panel de Control</h2>
      
      <div class="admin-tabs">
        <button class="tab-btn active" onclick="switchTab('prod-tab')">📦 Productos</button>
        <button class="tab-btn" onclick="switchTab('cat-tab')">🏷️ Categorías</button>
        <button class="tab-btn" onclick="switchTab('settings-tab')">🎨 Apariencia</button>
      </div>

      <div class="tab-pane active" id="prod-tab">
        <form onsubmit="saveProduct(event)">
          <input type="hidden" id="editing-prod-id">
          <div class="form-group"><label>Nombre del Producto</label><input type="text" id="prod-title" required></div>
          <div class="form-group"><label>Categoría</label><select id="prod-cat"></select></div>
          <div class="form-group"><label>Precio ($)</label><input type="text" id="prod-price" required></div>
          
          <div class="form-group">
            <label>Estado del Producto</label>
            <select id="prod-status">
              <option value="Disponible">Disponible</option>
              <option value="Agotado">Agotado</option>
            </select>
          </div>

          <div class="form-group">
            <label>Subir Imagen desde dispositivo</label>
            <input type="file" id="prod-img-file" accept="image/*">
            <div class="or-divider">— O PEGA UN ENLACE WEB —</div>
            <input type="url" id="prod-img-url" placeholder="https://ejemplo.com/imagen.jpg">
          </div>

          <div class="form-group"><label>Descripción</label><textarea id="prod-desc" rows="3" placeholder="Detalles del producto..."></textarea></div>
          <button type="submit" id="btn-save-prod" class="btn-submit">💾 Guardar Producto</button>
          <button type="button" id="btn-cancel-edit" class="btn-cancel" onclick="resetProductForm()">Cancelar Edición</button>
        </form>

        <h3 style="margin-top:20px; margin-bottom:10px;">Lista de Productos</h3>
        <div id="admin-prod-list"></div>
      </div>

      <div class="tab-pane" id="cat-tab">
        <div class="form-group">
          <label>Nueva Categoría</label>
          <input type="text" id="new-cat-input" placeholder="Ej: Relojes">
        </div>
        <button onclick="addCategory()" class="btn-submit">➕ Agregar Categoría</button>
        <h3 style="margin-top:20px; margin-bottom:10px;">Categorías Actuales</h3>
        <div id="admin-cat-list"></div>
      </div>

      <div class="tab-pane" id="settings-tab">
        <div class="form-group"><label>Nombre de la Tienda</label><input type="text" id="setting-title" value="Joliee Store"></div>
        <div class="form-group"><label>Subtítulo (Opcional)</label><input type="text" id="setting-sub" value="Catálogo Oficial"></div>
        
        <div class="form-group">
          <label>Logo de la Tienda (Subir archivo o Enlace)</label>
          <input type="file" id="setting-logo-file" accept="image/*">
          <div class="or-divider">— O PEGA UN ENLACE WEB —</div>
          <input type="url" id="setting-logo-url" placeholder="https://i.ibb.co/689L53H/joliee-store-logo.png">
        </div>

        <div class="form-group"><label>Teléfono WhatsApp (Con código de país)</label><input type="text" id="setting-phone" placeholder="584120000000"></div>

        <h3 style="margin-top:20px; margin-bottom:8px;">🎨 Personalizador de Colores</h3>
        <label style="font-size:12px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:6px;">Temas Rápidos de Temporada:</label>
        <div class="preset-grid">
          <button type="button" class="btn-preset" onclick="applyColorPreset('#800020', '#f8f6f6', '#ffffff', '#2b2b2b', '#666666')">🍷 Clásico Joliee</button>
          <button type="button" class="btn-preset" onclick="applyColorPreset('#b30000', '#f4fbf4', '#ffffff', '#1b4d1b', '#4a7c4a')">🎄 Navidad</button>
          <button type="button" class="btn-preset" onclick="applyColorPreset('#e65100', '#181818', '#242424', '#ffffff', '#b0b0b0')">🎃 Halloween</button>
          <button type="button" class="btn-preset" onclick="applyColorPreset('#d81b60', '#fcf4f8', '#ffffff', '#3e2723', '#8d6e63')">🌸 Primavera</button>
        </div>

        <div class="color-pickers-grid">
          <div class="color-picker-item">
            <label>Color Principal</label>
            <input type="color" id="theme-primary" value="#800020">
          </div>
          <div class="color-picker-item">
            <label>Fondo Página</label>
            <input type="color" id="theme-bg" value="#f8f6f6">
          </div>
          <div class="color-picker-item">
            <label>Fondo Tarjetas</label>
            <input type="color" id="theme-surface" value="#ffffff">
          </div>
          <div class="color-picker-item">
            <label>Texto Principal</label>
            <input type="color" id="theme-text" value="#2b2b2b">
          </div>
        </div>

        <button onclick="saveSettings()" class="btn-submit">💾 Guardar Cambios</button>
      </div>

    </div>
  </div>

      { id: 348, title: "Rimel Big Time Eyes Sheglam", cat: "Rimel y Delineadores", price: "5.00", img: "https://images.unsplash.com/photo-1512496015851-a90fb38ba796?w=400", status: "Disponible", desc: "Tendrás pestañas radiantes y con definición de alto impacto." }
    ];

    let storeData = {
      categories: JSON.parse(localStorage.getItem('js_cats_v7')) || defaultCategories,
      products: JSON.parse(localStorage.getItem('js_prods_v7')) || defaultProducts,
      settings: JSON.parse(localStorage.getItem('js_settings_v7')) || {
        title: "Joliee Store",
        sub: "Catálogo Oficial",
        logo: "https://i.ibb.co/689L53H/joliee-store-logo.png",
        phone: "",
        primary: "#800020",
        bg: "#f8f6f6",
        surface: "#ffffff",
        text: "#2b2b2b",
        textMuted: "#666666"
      },
      activeCat: "Todos",
      currentPage: 1,
      itemsPerPage: 24
    };

    if (!localStorage.getItem('js_prods_v7')) {
      localStorage.setItem('js_prods_v7', JSON.stringify(defaultProducts));
      localStorage.setItem('js_cats_v7', JSON.stringify(defaultCategories));
      localStorage.setItem('js_settings_v7', JSON.stringify(storeData.settings));
    }

    function init() {
      applySettings();
      renderCategories();
      renderCatalog();
    }

    function applySettings() {
      const s = storeData.settings;
      document.getElementById('display-title').innerText = s.title || "Joliee Store";
      document.getElementById('display-sub').innerText = s.sub || "";
      document.getElementById('page-title').innerText = s.title || "Joliee Store";
      
      const logoEl = document.getElementById('store-logo');
      const logoUrl = s.logo || "https://i.ibb.co/689L53H/joliee-store-logo.png";
      if (logoUrl) {
        logoEl.src = logoUrl;
        logoEl.style.display = "block";
      } else {
        logoEl.style.display = "none";
      }

      document.documentElement.style.setProperty('--primary', s.primary || '#800020');
      document.documentElement.style.setProperty('--bg', s.bg || '#f8f6f6');
      document.documentElement.style.setProperty('--surface', s.surface || '#ffffff');
      document.documentElement.style.setProperty('--text', s.text || '#2b2b2b');
      document.documentElement.style.setProperty('--text-muted', s.textMuted || '#666666');

      if (document.getElementById('theme-primary')) document.getElementById('theme-primary').value = s.primary || '#800020';
      if (document.getElementById('theme-bg')) document.getElementById('theme-bg').value = s.bg || '#f8f6f6';
      if (document.getElementById('theme-surface')) document.getElementById('theme-surface').value = s.surface || '#ffffff';
      if (document.getElementById('theme-text')) document.getElementById('theme-text').value = s.text || '#2b2b2b';
    }

    function applyColorPreset(primary, bg, surface, text, textMuted) {
      document.getElementById('theme-primary').value = primary;
      document.getElementById('theme-bg').value = bg;
      document.getElementById('theme-surface').value = surface;
      document.getElementById('theme-text').value = text;
    }

    function renderCategories() {
      const bar = document.getElementById('cat-chips');
      const select = document.getElementById('prod-cat');
      const adminList = document.getElementById('admin-cat-list');
      
      if (!bar || !select) return;

      bar.innerHTML = "";
      select.innerHTML = "";
      if (adminList) adminList.innerHTML = "";

      storeData.categories.forEach(cat => {
        const chip = document.createElement('button');
        chip.className = `cat-chip ${storeData.activeCat === cat ? 'active' : ''}`;
        chip.innerText = cat;
        chip.onclick = () => { storeData.activeCat = cat; storeData.currentPage = 1; renderCategories(); renderCatalog(); };
        bar.appendChild(chip);

        if (cat !== "Todos") {
          const opt = document.createElement('option');
          opt.value = cat; opt.innerText = cat;
          select.appendChild(opt);

          if (adminList) {
            const item = document.createElement('div');
            item.className = "admin-item";
            item.innerHTML = `<span>${cat}</span><button class="btn-del" onclick="deleteCategory('${cat}')">Eliminar</button>`;
            adminList.appendChild(item);
          }
        }
      });
    }

    function onSearchOrCatChange() {
      storeData.currentPage = 1;
      renderCatalog();
    }

    function changePerPage(val) {
      storeData.itemsPerPage = val === 'all' ? 999999 : parseInt(val);
      storeData.currentPage = 1;
      renderCatalog();
    }

    function renderCatalog() {
      const grid = document.getElementById('catalog-grid');
      const adminProdList = document.getElementById('admin-prod-list');
      const searchInput = document.getElementById('search-input');
      const search = searchInput ? searchInput.value.toLowerCase() : "";
      
      if (!grid) return;
      grid.innerHTML = "";
      if (adminProdList) adminProdList.innerHTML = "";

      const filtered = storeData.products.filter(p => {
        const matchCat = storeData.activeCat === "Todos" || p.cat === storeData.activeCat;
        const matchSearch = p.title.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });

      const totalItems = filtered.length;
      const itemsPerPage = storeData.itemsPerPage;
      const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;

      if (storeData.currentPage > totalPages) storeData.currentPage = totalPages;
      const startIndex = (storeData.currentPage - 1) * itemsPerPage;
      const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
      const paginatedItems = filtered.slice(startIndex, endIndex);

      paginatedItems.forEach(p => {
        const card = document.createElement('div');
        card.className = "card";
        card.onclick = () => openProductDetail(p.id);

        const isAgotado = p.status === "Agotado";
        const badgeHtml = isAgotado 
          ? `<span class="badge-status badge-soldout">Agotado</span>` 
          : `<span class="badge-status badge-available">Disponible</span>`;
        
        card.innerHTML = `
          <div class="card-img-container">
            ${badgeHtml}
            <img src="${p.img}" class="card-img" alt="${p.title}" onerror="this.src='https://via.placeholder.com/300'">
          </div>
          <div class="card-content">
            <span class="card-cat">${p.cat}</span>
            <div class="card-title">${p.title}</div>
            <div class="card-price">$${p.price}</div>
          </div>
        `;
        grid.appendChild(card);
      });

      renderPaginationControls(totalItems, startIndex, endIndex, totalPages);

      if (adminProdList) {
        storeData.products.forEach(p => {
          const item = document.createElement('div');
          item.className = "admin-item";
          item.innerHTML = `
            <span><strong>${p.title}</strong> ($${p.price}) - <em>${p.status || 'Disponible'}</em></span>
            <div class="admin-actions">
              <button class="btn-edit" onclick="editProduct(${p.id})">Editar</button>
              <button class="btn-del" onclick="deleteProduct(${p.id})">Eliminar</button>
            </div>
          `;
          adminProdList.appendChild(item);
        });
      }
    }

    function renderPaginationControls(totalItems, startIndex, endIndex, totalPages) {
      const infoText = document.getElementById('pagination-info-text');
      const controlsBox = document.getElementById('pagination-controls');

      if (totalItems === 0) {
        infoText.innerText = "Mostrando 0 de 0 productos";
        controlsBox.innerHTML = "";
        return;
      }

      infoText.innerText = `Mostrando ${startIndex + 1}–${endIndex} de ${totalItems}`;

      if (totalPages <= 1) {
        controlsBox.innerHTML = `
          <button class="page-btn" disabled>&lt;</button>
          <button class="page-btn active">1</button>
          <button class="page-btn" disabled>&gt;</button>
        `;
        return;
      }

      let html = `<button class="page-btn" ${storeData.currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${storeData.currentPage - 1})">&lt;</button>`;

      const curr = storeData.currentPage;
      let pages = [];

      if (totalPages <= 7) {
        for (let i = 1; i <= totalPages; i++) pages.push(i);
      } else {
        pages.push(1);
        if (curr > 3) pages.push('...');
        
        let start = Math.max(2, curr - 1);
        let end = Math.min(totalPages - 1, curr + 1);
        for (let i = start; i <= end; i++) pages.push(i);
        
        if (curr < totalPages - 2) pages.push('...');
        pages.push(totalPages);
      }

      pages.forEach(p => {
        if (p === '...') {
          html += `<span class="page-ellipsis">...</span>`;
        } else {
          html += `<button class="page-btn ${p === curr ? 'active' : ''}" onclick="goToPage(${p})">${p}</button>`;
        }
      });

      html += `<button class="page-btn" ${storeData.currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${storeData.currentPage + 1})">&gt;</button>`;
      controlsBox.innerHTML = html;
    }

    function goToPage(p) {
      storeData.currentPage = p;
      renderCatalog();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openProductDetail(id) {
      const p = storeData.products.find(item => item.id === id);
      if (!p) return;

      document.getElementById('detail-img').src = p.img;
      document.getElementById('detail-cat').innerText = p.cat;
      document.getElementById('detail-title').innerText = p.title;
      document.getElementById('detail-price').innerText = '$' + p.price;
      document.getElementById('detail-desc').innerText = p.desc || 'No hay descripción detallada para este producto.';

      const badgeBox = document.getElementById('detail-badge');
      const isAgotado = p.status === "Agotado";
      badgeBox.innerHTML = isAgotado 
        ? `<span class="badge-status badge-soldout" style="position:static; display:inline-block;">Agotado</span>` 
        : `<span class="badge-status badge-available" style="position:static; display:inline-block;">Disponible</span>`;

      const wsBtn = document.getElementById('detail-ws-btn');
      const phone = storeData.settings.phone ? storeData.settings.phone : "";
      const wsMsg = `https://wa.me/${phone}?text=${encodeURIComponent('Hola! Me interesa: ' + p.title + ' ($' + p.price + ')')}`;

      if (isAgotado) {
        wsBtn.className = "btn-ws disabled";
        wsBtn.href = "#";
        wsBtn.innerText = "Producto Agotado";
      } else {
        wsBtn.className = "btn-ws";
        wsBtn.href = wsMsg;
        wsBtn.innerText = "Pedir por WhatsApp";
      }

      document.getElementById('product-detail-modal').style.display = 'flex';
    }

    function closeProductDetail() {
      document.getElementById('product-detail-modal').style.display = 'none';
    }

    function openAdmin() { document.getElementById('admin-modal').style.display = 'flex'; }
    function closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; resetProductForm(); }
    
    function switchTab(tabId) {
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    function addCategory() {
      const input = document.getElementById('new-cat-input');
      if (!input) return;
      const val = input.value.trim();
      if (val && !storeData.categories.includes(val)) {
        storeData.categories.push(val);
        localStorage.setItem('js_cats_v7', JSON.stringify(storeData.categories));
        input.value = "";
        renderCategories();
      }
    }

    function deleteCategory(cat) {
      storeData.categories = storeData.categories.filter(c => c !== cat);
      localStorage.setItem('js_cats_v7', JSON.stringify(storeData.categories));
      renderCategories();
    }

    function saveProduct(e) {
      e.preventDefault();
      const editingId = document.getElementById('editing-prod-id').value;
      const title = document.getElementById('prod-title')?.value || '';
      const cat = document.getElementById('prod-cat')?.value || '';
      const price = document.getElementById('prod-price')?.value || '';
      const status = document.getElementById('prod-status')?.value || 'Disponible';
      const desc = document.getElementById('prod-desc')?.value || '';
      const fileInput = document.getElementById('prod-img-file');
      const urlInput = document.getElementById('prod-img-url')?.value.trim();

      const existingProd = editingId ? storeData.products.find(p => p.id == editingId) : null;
      let defaultImg = existingProd ? existingProd.img : "https://via.placeholder.com/300";

      const finishSave = (finalImg) => {
        if (editingId) {
          storeData.products = storeData.products.map(p => {
            if (p.id == editingId) {
              return { id: Number(editingId), title, cat, price, status, img: finalImg || p.img, desc };
            }
            return p;
          });
          alert("¡Producto actualizado exitosamente!");
        } else {
          const newProd = {
            id: Date.now(),
            title,
            cat,
            price,
            status,
            img: finalImg || defaultImg,
            desc
          };
          storeData.products.push(newProd);
          alert("¡Producto guardado exitosamente!");
        }

        localStorage.setItem('js_prods_v7', JSON.stringify(storeData.products));
        renderCatalog();
        resetProductForm();
      };

      if (fileInput && fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(uploadEvent) {
          finishSave(uploadEvent.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else if (urlInput) {
        finishSave(urlInput);
      } else {
        finishSave(existingProd ? existingProd.img : defaultImg);
      }
    }

    function editProduct(id) {
      const p = storeData.products.find(item => item.id === id);
      if (!p) return;

      document.getElementById('editing-prod-id').value = p.id;
      document.getElementById('prod-title').value = p.title;
      document.getElementById('prod-cat').value = p.cat;
      document.getElementById('prod-price').value = p.price;
      document.getElementById('prod-status').value = p.status || "Disponible";
      document.getElementById('prod-desc').value = p.desc || "";
      document.getElementById('prod-img-url').value = p.img.startsWith('data:') ? '' : p.img;
      document.getElementById('prod-img-file').value = "";

      document.getElementById('btn-save-prod').innerText = "💾 Actualizar Producto";
      document.getElementById('btn-cancel-edit').style.display = "block";
      
      switchTab('prod-tab');
    }

    function resetProductForm() {
      document.getElementById('editing-prod-id').value = "";
      document.querySelector('#prod-tab form').reset();
      document.getElementById('btn-save-prod').innerText = "💾 Guardar Producto";
      document.getElementById('btn-cancel-edit').style.display = "none";
    }

    function deleteProduct(id) {
      storeData.products = storeData.products.filter(p => p.id !== id);
      localStorage.setItem('js_prods_v7', JSON.stringify(storeData.products));
      renderCatalog();
    }

    function saveSettings() {
      const title = document.getElementById('setting-title')?.value || "Joliee Store";
      const sub = document.getElementById('setting-sub')?.value || "";
      const phone = document.getElementById('setting-phone')?.value || "";
      const fileInput = document.getElementById('setting-logo-file');
      const urlInput = document.getElementById('setting-logo-url')?.value.trim();

      const primary = document.getElementById('theme-primary')?.value || "#800020";
      const bg = document.getElementById('theme-bg')?.value || "#f8f6f6";
      const surface = document.getElementById('theme-surface')?.value || "#ffffff";
      const text = document.getElementById('theme-text')?.value || "#2b2b2b";

      const updateData = (logoSrc) => {
        storeData.settings.title = title;
        storeData.settings.sub = sub;
        if (logoSrc !== undefined && logoSrc !== "") storeData.settings.logo = logoSrc;
        storeData.settings.phone = phone;
        storeData.settings.primary = primary;
        storeData.settings.bg = bg;
        storeData.settings.surface = surface;
        storeData.settings.text = text;

        localStorage.setItem('js_settings_v7', JSON.stringify(storeData.settings));
        applySettings();
        alert("¡Apariencia y logotipo actualizados exitosamente!");
      };

      if (fileInput && fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(uploadEvent) {
          updateData(uploadEvent.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else if (urlInput) {
        updateData(urlInput);
      } else {
        updateData(undefined);
      }
    }

    init();
  </script>
