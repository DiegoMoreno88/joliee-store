<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Joliee Store - Catálogo Oficial</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #800020;
      --primary-hover: #5d0017;
      --bg: #f8f6f6;
      --surface: #ffffff;
      --text: #2b2b2b;
      --text-muted: #666666;
      --border: #e8e3e3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; }
    header { background: var(--surface); padding: 20px; text-align: center; border-bottom: 1px solid var(--border); position: relative; }
    .logo-img { max-height: 80px; margin-bottom: 10px; border-radius: 8px; display: none; margin-left: auto; margin-right: auto; object-fit: contain; }
    .store-name { font-size: 26px; font-weight: 700; color: var(--primary); }
    .store-sub { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
    .admin-trigger { position: absolute; right: 15px; top: 15px; background: none; border: none; font-size: 24px; cursor: pointer; padding: 5px; z-index: 10; }
    .container { max-width: 1000px; margin: 0 auto; padding: 20px 15px; }
    .search-box { width: 100%; padding: 12px 18px; border-radius: 25px; border: 1px solid var(--border); font-size: 15px; outline: none; margin-bottom: 15px; background: var(--surface); }
    .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
    .cat-chip { padding: 8px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; font-size: 14px; cursor: pointer; white-space: nowrap; font-weight: 500; }
    .cat-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; }
    .card { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; position: relative; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
    .card-img-container { position: relative; width: 100%; height: 210px; background: #eee; }
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-status { position: absolute; top: 8px; left: 8px; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; z-index: 2; }
    .badge-available { background: #25d366; color: white; }
    .badge-soldout { background: #ff4d4d; color: white; }
    
    .card-content { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-cat { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; }
    .card-price { font-size: 18px; font-weight: 700; color: var(--primary); }
    
    .btn-ws { background: #25d366; color: white; text-decoration: none; padding: 12px; border-radius: 8px; text-align: center; font-weight: 600; font-size: 15px; display: block; border: none; width: 100%; cursor: pointer; }
    .btn-ws.disabled { background: #ccc; pointer-events: none; }
    
    /* Modales */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
    .modal-content { background: var(--surface); width: 100%; max-width: 550px; max-height: 90vh; border-radius: 16px; overflow-y: auto; padding: 25px; position: relative; }
    .close-btn { position: absolute; right: 20px; top: 20px; font-size: 26px; border: none; background: none; cursor: pointer; color: var(--text-muted); z-index: 10; }
    
    .admin-tabs { display: flex; gap: 10px; border-bottom: 1px solid var(--border); margin-bottom: 15px; margin-top: 15px; }
    .tab-btn { padding: 8px 14px; border: none; background: none; cursor: pointer; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; }
    .tab-btn.active { color: var(--primary); border-color: var(--primary); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    .or-divider { text-align: center; font-size: 11px; color: var(--text-muted); margin: 4px 0; font-weight: 600; }
    .btn-submit { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 10px; }
    .btn-cancel { background: #666; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 5px; display: none; }
    .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--border); font-size: 14px; gap: 10px; }
    .admin-actions { display: flex; gap: 5px; }
    .btn-edit { background: #007bff; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .btn-del { background: #ff4d4d; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    
    /* MODAL DETALLE: Imagen Completa sin cortes */
    .detail-img-box { position: relative; width: 100%; background: #f0f0f0; border-radius: 12px; overflow: hidden; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
    .detail-img { width: 100%; max-height: 380px; object-fit: contain; display: block; margin: 0 auto; }
    .detail-cat { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
    .detail-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .detail-price { font-size: 24px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .detail-desc-box { background: #f9f9f9; padding: 12px; border-radius: 8px; font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; border: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <button class="admin-trigger" onclick="openAdmin()" title="Panel de Administración">⚙️</button>
    <img id="store-logo" class="logo-img" src="" alt="Logo">
    <div id="display-title" class="store-name">Joliee Store</div>
    <div id="display-sub" class="store-sub">Catálogo Oficial</div>
  </header>

  <div class="container">
    <input type="text" id="search-input" class="search-box" placeholder="Buscar por producto..." oninput="renderCatalog()">
    <div class="categories-bar" id="cat-chips"></div>
    <div class="products-grid" id="catalog-grid"></div>
  </div>

  <!-- MODAL DETALLE DE PRODUCTO -->
  <div class="modal" id="product-detail-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeProductDetail()">&times;</button>
      <div class="detail-img-box">
        <div id="detail-badge" style="position:absolute; top:10px; left:10px; z-index:5;"></div>
        <img id="detail-img" class="detail-img" src="" alt="Producto">
      </div>
      <div id="detail-cat" class="detail-cat"></div>
      <h2 id="detail-title" class="detail-title"></h2>
      <div id="detail-price" class="detail-price"></div>
      <div style="font-size: 13px; font-weight: 600; margin-bottom: 6px;">Descripción:</div>
      <div id="detail-desc" class="detail-desc-box"></div>
      <a id="detail-ws-btn" href="#" class="btn-ws" target="_blank">Pedir por WhatsApp</a>
    </div>
  </div>

  <!-- MODAL ADMIN -->
  <div class="modal" id="admin-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeAdmin()">&times;</button>
      <h2>⚙️ Panel de Control</h2>
      
      <div class="admin-tabs">
        <button class="tab-btn active" onclick="switchTab('prod-tab')">📦 Productos</button>
        <button class="tab-btn" onclick="switchTab('cat-tab')">🏷️ Categorías</button>
        <button class="tab-btn" onclick="switchTab('settings-tab')">🎨 Apariencia</button>
      </div>

      <!-- TAB PRODUCTOS -->
      <div class="tab-pane active" id="prod-tab">
        <form onsubmit="saveProduct(event)">
          <input type="hidden" id="editing-prod-id">
          <div class="form-group"><label>Nombre del Producto</label><input type="text" id="prod-title" required></div>
          <div class="form-group"><label>Categoría</label><select id="prod-cat"></select></div>
          <div class="form-group"><label>Precio ($)</label><input type="text" id="prod-price" required></div>
          
          <div class="form-group">
            <label>Estado del Producto</label>
            <select id="prod-status">
              <option value="Disponible">Disponible</option>
              <option value="Agotado">Agotado</option>
            </select>
          </div>

          <!-- IMAGEN PRODUCTO: AMBAS OPCIONES -->
          <div class="form-group">
            <label>Subir Imagen desde dispositivo</label>
            <input type="file" id="prod-img-file" accept="image/*">
            <div class="or-divider">— O PEGA UN ENLACE WEB —</div>
            <input type="url" id="prod-img-url" placeholder="https://ejemplo.com/imagen.jpg">
          </div>

          <div class="form-group"><label>Descripción</label><textarea id="prod-desc" rows="3" placeholder="Detalles del producto..."></textarea></div>
          <button type="submit" id="btn-save-prod" class="btn-submit">💾 Guardar Producto</button>
          <button type="button" id="btn-cancel-edit" class="btn-cancel" onclick="resetProductForm()">Cancelar Edición</button>
        </form>

        <h3 style="margin-top:20px; margin-bottom:10px;">Lista de Productos</h3>
        <div id="admin-prod-list"></div>
      </div>

      <!-- TAB CATEGORIAS -->
      <div class="tab-pane" id="cat-tab">
        <div class="form-group">
          <label>Nueva Categoría</label>
          <input type="text" id="new-cat-input" placeholder="Ej: Relojes">
        </div>
        <button onclick="addCategory()" class="btn-submit">➕ Agregar Categoría</button>
        <h3 style="margin-top:20px; margin-bottom:10px;">Categorías Actuales</h3>
        <div id="admin-cat-list"></div>
      </div>

      <!-- TAB APARIENCIA -->
      <div class="tab-pane" id="settings-tab">
        <div class="form-group"><label>Nombre de la Tienda</label><input type="text" id="setting-title" value="Joliee Store"></div>
        <div class="form-group"><label>Subtítulo (Opcional)</label><input type="text" id="setting-sub" value="Catálogo Oficial"></div>
        
        <!-- LOGO: AMBAS OPCIONES -->
        <div class="form-group">
          <label>Logo de la Tienda (Subir archivo)</label>
          <input type="file" id="setting-logo-file" accept="image/*">
          <div class="or-divider">— O PEGA UN ENLACE WEB —</div>
          <input type="url" id="setting-logo-url" placeholder="https://ejemplo.com/logo.jpg">
        </div>

        <div class="form-group"><label>Teléfono WhatsApp (Con código de país)</label><input type="text" id="setting-phone" placeholder="584120000000"></div>
        <button onclick="saveSettings()" class="btn-submit">💾 Guardar Cambios</button>
      </div>

    </div>
  </div>

  <script>
    let defaultCategories = ["Todos", "Cuidado Facial", "Splash, Cremas, Perfumes"];
    let defaultProducts = [
      { id: 101, title: "Crema Facial SADOER Vitamin C", cat: "Cuidado Facial", price: "7.50", img: "https://via.placeholder.com/300?text=Crema+SADOER+Vit+C", status: "Disponible", desc: "Fórmula Iluminadora (Brightening Moist)." },

      { id: 103, title: "Espuma Limpiadora Facial SADOER", cat: "Splash, Cremas, Perfumes", price: "9.00", img: "https://via.placeholder.com/300?text=Espuma+Limpiadora", status: "Disponible", desc: "¡El limpiador en mousse más práctico y completo!" },
      { id: 104, title: "Limpiador Facial SADOER Vitamina C", cat: "Cuidado Facial", price: "6.00", img: "https://via.placeholder.com/300?text=Limpiador+Vit+C", status: "Disponible", desc: "Este limpiador facial ayuda a aclarar la piel de SADOER." },
      { id: 105, title: "Protector Solar Disaar Ácido Hialurónico", cat: "Cuidado Facial", price: "6.50", img: "https://via.placeholder.com/300?text=Protector+Solar+Disaar", status: "Disponible", desc: "¡El aliado perfecto para proteger la piel del sol!" },
      { id: 106, title: "Jabón en Barra Disaar Ácido Hialurónico", cat: "Cuidado Facial", price: "7.00", img: "https://via.placeholder.com/300?text=Jabon+Disaar", status: "Disponible", desc: "¡El limpiador en barra ideal para purificar la piel!" },

      { id: 107, title: "Exfoliante Corporal y Facial Disaar Retinol VE", cat: "Cuidado Facial", price: "12.50", img: "https://via.placeholder.com/300?text=Exfoliante+Retinol", status: "Disponible", desc: "¡El exfoliante ideal para renovar la piel mientras hidratas!" },
      { id: 108, title: "Sérum Facial Ceramide & Vitamin E", cat: "Cuidado Facial", price: "7.00", img: "https://via.placeholder.com/300?text=Serum+Ceramide", status: "Disponible", desc: "Tratamientos Especializados Multi-acción." },
      { id: 109, title: "Exfoliante Corporal y Facial Disaar Ácido Hialurónico", cat: "Cuidado Facial", price: "12.50", img: "https://via.placeholder.com/300?text=Exfoliante+Acido+Hialuronico", status: "Disponible", desc: "¡El secreto para remover células muertas sin resecar!" },
      { id: 110, title: "Sérum Facial SADOER 4 in 1 Repair", cat: "Cuidado Facial", price: "6.00", img: "https://via.placeholder.com/300?text=Serum+SADOER+4in1", status: "Disponible", desc: "Este suero facial multifunción de SADOER repara la piel de forma profunda." },
      { id: 111, title: "Crema Facial SADOER Vitamin C Brightening", cat: "Cuidado Facial", price: "7.50", img: "https://via.placeholder.com/300?text=Crema+SADOER", status: "Disponible", desc: "¡El toque final indispensable para sellar la hidratación!" },
      { id: 112, title: "Sérum Facial SADOER 5x Vitamin C", cat: "Cuidado Facial", price: "6.00", img: "https://via.placeholder.com/300?text=Serum+SADOER+5x", status: "Disponible", desc: "¡El sérum concentrado que todas quieren en su rutina!" },

      { id: 113, title: "Sérum Facial Disaar Ácido Hialurónico", cat: "Cuidado Facial", price: "7.00", img: "https://via.placeholder.com/300?text=Serum+Disaar+HA", status: "Disponible", desc: "¡El serum infaltable para una piel firme y radiante!" },
      { id: 114, title: "Loción Corporal Disaar Ácido Hialurónico", cat: "Splash, Cremas, Perfumes", price: "12.50", img: "https://via.placeholder.com/300?text=Locion+Corporal+HA", status: "Disponible", desc: "¡Un rescate de hidratación profunda que tus clientes amarán!" },
      { id: 115, title: "Crema Facial Disaar Retinol & Vitamina E", cat: "Cuidado Facial", price: "9.00", img: "https://via.placeholder.com/300?text=Crema+Disaar+Retinol", status: "Disponible", desc: "¡El tratamiento hidratante ideal para restaurar la juventud!" },
      { id: 116, title: "Loción Corporal Disaar Retinol & Vitamina E", cat: "Splash, Cremas, Perfumes", price: "12.50", img: "https://via.placeholder.com/300?text=Locion+Corporal+Retinol", status: "Disponible", desc: "¡El secreto para una piel firme, joven y suave en todo el cuerpo!" },
      { id: 117, title: "Sérum Facial Disaar Retinol & Vitamina E", cat: "Cuidado Facial", price: "7.00", img: "https://via.placeholder.com/300?text=Serum+Disaar+Retinol", status: "Disponible", desc: "¡El serum infaltable para renovar la piel y prevenir signos de edad!" },
      { id: 118, title: "Limpiador Facial Disaar Retinol & Vitamina E", cat: "Cuidado Facial", price: "7.50", img: "https://via.placeholder.com/300?text=Limpiador+Disaar+Retinol", status: "Disponible", desc: "¡El paso esencial para preparar la piel y eliminar impurezas!" },

      { id: 119, title: "Crema Facial Disaar 7 in 1 Grape Seed", cat: "Cuidado Facial", price: "8.50", img: "https://via.placeholder.com/300?text=Crema+Disaar+Grape+Seed", status: "Disponible", desc: "¡La fórmula multi-acción perfecta para unificar el tono!" },
      { id: 120, title: "Crema Facial Disaar 7 in 1 Peptides & Shea", cat: "Cuidado Facial", price: "8.50", img: "https://via.placeholder.com/300?text=Crema+Disaar+Peptides", status: "Disponible", desc: "¡La solución «todo en uno» perfecta para nutrir profundamente!" },
      { id: 121, title: "Sérum Facial Peptides & Collagen", cat: "Cuidado Facial", price: "7.00", img: "https://via.placeholder.com/300?text=Serum+Peptides+Collagen", status: "Disponible", desc: "Tratamientos Especializados Multi-acción para firmeza." },
      { id: 122, title: "Sérum Facial Grape Seed & Niacinamide", cat: "Cuidado Facial", price: "7.00", img: "https://via.placeholder.com/300?text=Serum+Grape+Seed", status: "Disponible", desc: "Tratamientos Especializados Multi-acción iluminadores." },
      { id: 123, title: "Sérum Facial Retinol & Vitamin E-Línea 7in1", cat: "Cuidado Facial", price: "7.00", img: "https://via.placeholder.com/300?text=Serum+Retinol+7in1", status: "Disponible", desc: "Tratamientos Especializados Multi-acción antiedad." },
      { id: 124, title: "Sérum Facial PDRN & Ceramide -Línea 7in1", cat: "Cuidado Facial", price: "7.00", img: "https://via.placeholder.com/300?text=Serum+PDRN+Ceramide", status: "Disponible", desc: "Tratamientos Especializados Multi-acción regeneradores." }
    ];

    let storeData = {
      categories: JSON.parse(localStorage.getItem('js_cats')) || defaultCategories,
      products: JSON.parse(localStorage.getItem('js_prods')) || defaultProducts,
      settings: JSON.parse(localStorage.getItem('js_settings')) || { title: "Joliee Store", sub: "Catálogo Oficial", logo: "", phone: "" },
      activeCat: "Todos"
    };

    function init() {
      applySettings();
      renderCategories();
      renderCatalog();
    }

    function applySettings() {
      document.getElementById('display-title').innerText = storeData.settings.title || "Joliee Store";
      document.getElementById('display-sub').innerText = storeData.settings.sub || "";
      document.getElementById('page-title').innerText = storeData.settings.title || "Joliee Store";
      const logoEl = document.getElementById('store-logo');
      if (storeData.settings.logo) {
        logoEl.src = storeData.settings.logo;
        logoEl.style.display = "block";
      } else {
        logoEl.style.display = "none";
      }
    }

    function renderCategories() {
      const bar = document.getElementById('cat-chips');
      const select = document.getElementById('prod-cat');
      const adminList = document.getElementById('admin-cat-list');
      
      if (!bar || !select) return;

      bar.innerHTML = "";
      select.innerHTML = "";
      if (adminList) adminList.innerHTML = "";

      storeData.categories.forEach(cat => {
        const chip = document.createElement('button');
        chip.className = `cat-chip ${storeData.activeCat === cat ? 'active' : ''}`;
        chip.innerText = cat;
        chip.onclick = () => { storeData.activeCat = cat; renderCategories(); renderCatalog(); };
        bar.appendChild(chip);

        if (cat !== "Todos") {
          const opt = document.createElement('option');
          opt.value = cat; opt.innerText = cat;
          select.appendChild(opt);

          if (adminList) {
            const item = document.createElement('div');
            item.className = "admin-item";
            item.innerHTML = `<span>${cat}</span><button class="btn-del" onclick="deleteCategory('${cat}')">Eliminar</button>`;
            adminList.appendChild(item);
          }
        }
      });
    }

    function renderCatalog() {
      const grid = document.getElementById('catalog-grid');
      const adminProdList = document.getElementById('admin-prod-list');
      const searchInput = document.getElementById('search-input');
      const search = searchInput ? searchInput.value.toLowerCase() : "";
      
      if (!grid) return;
      grid.innerHTML = "";
      if (adminProdList) adminProdList.innerHTML = "";

      const filtered = storeData.products.filter(p => {
        const matchCat = storeData.activeCat === "Todos" || p.cat === storeData.activeCat;
        const matchSearch = p.title.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });

      filtered.forEach(p => {
        const card = document.createElement('div');
        card.className = "card";
        card.onclick = () => openProductDetail(p.id);

        const isAgotado = p.status === "Agotado";
        const badgeHtml = isAgotado 
          ? `<span class="badge-status badge-soldout">Agotado</span>` 
          : `<span class="badge-status badge-available">Disponible</span>`;
        
        card.innerHTML = `
          <div class="card-img-container">
            ${badgeHtml}
            <img src="${p.img}" class="card-img" alt="${p.title}" onerror="this.src='https://via.placeholder.com/300'">
          </div>
          <div class="card-content">
            <span class="card-cat">${p.cat}</span>
            <div class="card-title">${p.title}</div>
            <div class="card-price">$${p.price}</div>
          </div>
        `;
        grid.appendChild(card);
      });

      if (adminProdList) {
        storeData.products.forEach(p => {
          const item = document.createElement('div');
          item.className = "admin-item";
          item.innerHTML = `
            <span><strong>${p.title}</strong> ($${p.price}) - <em>${p.status || 'Disponible'}</em></span>
            <div class="admin-actions">
              <button class="btn-edit" onclick="editProduct(${p.id})">Editar</button>
              <button class="btn-del" onclick="deleteProduct(${p.id})">Eliminar</button>
            </div>
          `;
          adminProdList.appendChild(item);
        });
      }
    }

    // Funciones del Modal de Detalle
    function openProductDetail(id) {
      const p = storeData.products.find(item => item.id === id);
      if (!p) return;

      document.getElementById('detail-img').src = p.img;
      document.getElementById('detail-cat').innerText = p.cat;
      document.getElementById('detail-title').innerText = p.title;
      document.getElementById('detail-price').innerText = '$' + p.price;
      document.getElementById('detail-desc').innerText = p.desc || 'No hay descripción detallada para este producto.';

      const badgeBox = document.getElementById('detail-badge');
      const isAgotado = p.status === "Agotado";
      badgeBox.innerHTML = isAgotado 
        ? `<span class="badge-status badge-soldout" style="position:static; display:inline-block;">Agotado</span>` 
        : `<span class="badge-status badge-available" style="position:static; display:inline-block;">Disponible</span>`;

      const wsBtn = document.getElementById('detail-ws-btn');
      const phone = storeData.settings.phone ? storeData.settings.phone : "";
      const wsMsg = `https://wa.me/${phone}?text=${encodeURIComponent('Hola! Me interesa: ' + p.title + ' ($' + p.price + ')')}`;

      if (isAgotado) {
        wsBtn.className = "btn-ws disabled";
        wsBtn.href = "#";
        wsBtn.innerText = "Producto Agotado";
      } else {
        wsBtn.className = "btn-ws";
        wsBtn.href = wsMsg;
        wsBtn.innerText = "Pedir por WhatsApp";
      }

      document.getElementById('product-detail-modal').style.display = 'flex';
    }

    function closeProductDetail() {
      document.getElementById('product-detail-modal').style.display = 'none';
    }

    function openAdmin() { document.getElementById('admin-modal').style.display = 'flex'; }
    function closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; resetProductForm(); }
    
    function switchTab(tabId) {
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    function addCategory() {
      const input = document.getElementById('new-cat-input');
      if (!input) return;
      const val = input.value.trim();
      if (val && !storeData.categories.includes(val)) {
        storeData.categories.push(val);
        localStorage.setItem('js_cats', JSON.stringify(storeData.categories));
        input.value = "";
        renderCategories();
      }
    }

    function deleteCategory(cat) {
      storeData.categories = storeData.categories.filter(c => c !== cat);
      localStorage.setItem('js_cats', JSON.stringify(storeData.categories));
      renderCategories();
    }

    function saveProduct(e) {
      e.preventDefault();
      const editingId = document.getElementById('editing-prod-id').value;
      const title = document.getElementById('prod-title')?.value || '';
      const cat = document.getElementById('prod-cat')?.value || '';
      const price = document.getElementById('prod-price')?.value || '';
      const status = document.getElementById('prod-status')?.value || 'Disponible';
      const desc = document.getElementById('prod-desc')?.value || '';
      const fileInput = document.getElementById('prod-img-file');
      const urlInput = document.getElementById('prod-img-url')?.value.trim();

      const existingProd = editingId ? storeData.products.find(p => p.id == editingId) : null;
      let defaultImg = existingProd ? existingProd.img : "https://via.placeholder.com/300";

      const finishSave = (finalImg) => {
        if (editingId) {
          storeData.products = storeData.products.map(p => {
            if (p.id == editingId) {
              return { id: Number(editingId), title, cat, price, status, img: finalImg || p.img, desc };
            }
            return p;
          });
          alert("¡Producto actualizado exitosamente!");
        } else {
          const newProd = {
            id: Date.now(),
            title,
            cat,
            price,
            status,
            img: finalImg || defaultImg,
            desc
          };
          storeData.products.push(newProd);
          alert("¡Producto guardado exitosamente!");
        }

        localStorage.setItem('js_prods', JSON.stringify(storeData.products));
        renderCatalog();
        resetProductForm();
      };

      if (fileInput && fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(uploadEvent) {
          finishSave(uploadEvent.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else if (urlInput) {
        finishSave(urlInput);
      } else {
        finishSave(existingProd ? existingProd.img : defaultImg);
      }
    }

    function editProduct(id) {
      const p = storeData.products.find(item => item.id === id);
      if (!p) return;

      document.getElementById('editing-prod-id').value = p.id;
      document.getElementById('prod-title').value = p.title;
      document.getElementById('prod-cat').value = p.cat;
      document.getElementById('prod-price').value = p.price;
      document.getElementById('prod-status').value = p.status || "Disponible";
      document.getElementById('prod-desc').value = p.desc || "";
      document.getElementById('prod-img-url').value = p.img.startsWith('data:') ? '' : p.img;
      document.getElementById('prod-img-file').value = "";

      document.getElementById('btn-save-prod').innerText = "💾 Actualizar Producto";
      document.getElementById('btn-cancel-edit').style.display = "block";
      
      switchTab('prod-tab');
    }

    function resetProductForm() {
      document.getElementById('editing-prod-id').value = "";
      document.querySelector('#prod-tab form').reset();
      document.getElementById('btn-save-prod').innerText = "💾 Guardar Producto";
      document.getElementById('btn-cancel-edit').style.display = "none";
    }

    function deleteProduct(id) {
      storeData.products = storeData.products.filter(p => p.id !== id);
      localStorage.setItem('js_prods', JSON.stringify(storeData.products));
      renderCatalog();
    }

    function saveSettings() {
      const title = document.getElementById('setting-title')?.value || "Joliee Store";
      const sub = document.getElementById('setting-sub')?.value || "";
      const phone = document.getElementById('setting-phone')?.value || "";
      const fileInput = document.getElementById('setting-logo-file');
      const urlInput = document.getElementById('setting-logo-url')?.value.trim();

      const updateData = (logoSrc) => {
        storeData.settings.title = title;
        storeData.settings.sub = sub;
        if (logoSrc !== undefined) {
          storeData.settings.logo = logoSrc;
        }
        storeData.settings.phone = phone;
        localStorage.setItem('js_settings', JSON.stringify(storeData.settings));
        applySettings();
        alert("¡Apariencia actualizada!");
      };

      if (fileInput && fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(uploadEvent) {
          updateData(uploadEvent.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else if (urlInput) {
        updateData(urlInput);
      } else {
        updateData(undefined);
      }
    }

    init();
  </script>
</body>
</html>
