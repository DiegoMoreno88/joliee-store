<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="html-title">Joliee Store - Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-primary: #881337;
            --color-primary-hover: #9f1239;
            --color-bg: #f9fafb;
            --color-text: #1f2937;
        }
        body { background-color: var(--color-bg); color: var(--color-text); }
        .bg-custom-primary { background-color: var(--color-primary); }
        .bg-custom-primary:hover { background-color: var(--color-primary-hover); }
        .text-custom-primary { color: var(--color-primary); }
        .border-custom-primary { border-color: var(--color-primary); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Encabezado -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img id="store-logo-img" src="" alt="Logo" class="h-10 object-contain hidden">
                <div>
                    <h1 id="store-title-header" class="text-2xl font-bold text-custom-primary">Joliee Store</h1>
                    <p class="text-sm text-gray-500">Catálogo Oficial</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openAdminModal()" class="p-2 text-gray-600 hover:text-custom-primary transition" title="Panel de Administración">
                    <i class="fa-solid fa-gear text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Filtros y Búsqueda -->
    <div class="max-w-7xl mx-auto px-4 mt-6 w-full">
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" oninput="filterProducts()" placeholder="Buscar por producto..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-900">
            </div>
            <div id="category-filters" class="flex flex-wrap gap-2 w-full md:w-auto justify-start md:justify-end"></div>
        </div>
    </div>

    <!-- Catálogo -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-12 text-gray-400">Sincronizando inventario con la nube...</div>
        </div>
        <div id="pagination-container" class="flex justify-center items-center space-x-2 mt-10"></div>
    </main>

    <!-- Modal de Detalle del Producto -->
    <div id="product-detail-modal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full p-6 relative overflow-hidden">
            <button onclick="closeProductDetailModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 z-20 bg-white/80 rounded-full p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div class="flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-1/2 flex flex-col items-center">
                    <div class="h-64 w-full bg-gray-100 rounded-xl overflow-hidden relative shadow-inner">
                        <img id="detail-main-img" src="" alt="" class="w-full h-full object-cover">
                    </div>
                    <div id="detail-gallery-thumbs" class="flex gap-2 mt-3 overflow-x-auto w-full justify-center"></div>
                </div>
                <div class="w-full md:w-1/2 flex flex-col justify-between">
                    <div>
                        <span id="detail-product-cat" class="text-xs font-bold px-2.5 py-1 bg-rose-50 text-custom-primary rounded-full uppercase tracking-wider"></span>
                        <h2 id="detail-product-title" class="text-2xl font-bold text-gray-800 mt-2 mb-2"></h2>
                        <p id="detail-product-price" class="text-2xl font-extrabold text-custom-primary mb-4"></p>
                        <p id="detail-product-desc" class="text-sm text-gray-600 leading-relaxed mb-6"></p>
                    </div>
                    <div class="pt-4 border-t border-gray-100 flex items-center justify-between">
                        <span id="detail-product-status" class="text-xs px-3 py-1 bg-emerald-50 text-emerald-700 rounded-md font-semibold"></span>
                        <button onclick="closeProductDetailModal()" class="px-4 py-2 bg-gray-100 text-gray-700 text-sm font-semibold rounded-lg hover:bg-gray-200">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Admin Completo -->
    <div id="admin-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 relative max-h-[90vh] flex flex-col">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            
            <div id="admin-login-view">
                <h3 class="text-xl font-bold text-gray-800 mb-4">Panel de Administración</h3>
                <input type="password" id="admin-password" placeholder="Contraseña (por defecto 1234)" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-rose-900">
                <button onclick="verifyAdminPassword()" class="w-full bg-custom-primary text-white py-2 rounded-lg">Entrar</button>
            </div>

            <div id="admin-dashboard-view" class="hidden flex-col h-full overflow-hidden">
                <div class="flex border-b mb-4 pb-2 space-x-2">
                    <button onclick="switchTab('products')" id="tab-btn-products" class="px-4 py-2 text-sm font-bold bg-custom-primary text-white rounded-lg">Gestión de Productos</button>
                    <button onclick="switchTab('appearance')" id="tab-btn-appearance" class="px-4 py-2 text-sm font-bold bg-gray-200 text-gray-700 rounded-lg">Apariencia y Ajustes</button>
                </div>

                <!-- SECCIÓN 1: PRODUCTOS -->
                <div id="tab-content-products" class="flex flex-col h-full overflow-hidden">
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="font-bold text-sm text-gray-700">Lista de Productos</h4>
                        <button onclick="showAddProductForm()" class="bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg"><i class="fa-solid fa-plus"></i> Nuevo Producto</button>
                    </div>

                    <div id="product-form-container" class="hidden mb-3 p-3 bg-gray-50 border border-gray-200 rounded-lg">
                        <h5 id="form-title" class="font-bold text-xs text-gray-700 mb-2">Editar Producto</h5>
                        <input type="hidden" id="form-id">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
                            <input type="text" id="form-title-input" placeholder="Nombre" class="px-3 py-1.5 border rounded text-xs">
                            <input type="text" id="form-cat-input" placeholder="Categoría" class="px-3 py-1.5 border rounded text-xs">
                            <input type="text" id="form-price-input" placeholder="Precio ($)" class="px-3 py-1.5 border rounded text-xs">
                            <input type="text" id="form-img-input" placeholder="URL Foto Principal" class="px-3 py-1.5 border rounded text-xs">
                        </div>
                        <input type="text" id="form-gallery-input" placeholder="Links adicionales separados por comas (,)" class="w-full px-3 py-1.5 border rounded text-xs mb-2">
                        <textarea id="form-desc-input" placeholder="Descripción" class="w-full px-3 py-1.5 border rounded text-xs mb-2" rows="2"></textarea>
                        <div class="flex justify-end space-x-2">
                            <button onclick="cancelProductForm()" class="px-3 py-1 bg-gray-200 text-xs rounded">Cancelar</button>
                            <button onclick="saveProductToCloud()" class="px-3 py-1 bg-custom-primary text-white text-xs rounded">Guardar Producto</button>
                        </div>
                    </div>

                    <div class="overflow-y-auto flex-grow max-h-[40vh] space-y-2 pr-1">
                        <div id="admin-products-list"></div>
                    </div>
                </div>

                <!-- SECCIÓN 2: APARIENCIA Y SEGURIDAD -->
                <div id="tab-content-appearance" class="hidden flex-col space-y-4 overflow-y-auto max-h-[50vh] pr-1">
                    <div class="p-3 bg-gray-50 border rounded-lg space-y-3">
                        <h4 class="font-bold text-sm text-gray-700"><i class="fa-solid fa-palette"></i> Apariencia</h4>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600">Color Principal</label>
                            <input type="color" id="settings-primary-color" value="#881337" class="w-full h-10 p-1 border rounded cursor-pointer">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600">Nombre de la Tienda</label>
                            <input type="text" id="settings-store-title" value="Joliee Store" class="w-full px-3 py-1.5 border rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600">URL del Logo (Opcional)</label>
                            <input type="text" id="settings-store-logo" placeholder="https://..." class="w-full px-3 py-1.5 border rounded text-sm">
                        </div>
                    </div>

                    <div class="p-3 bg-gray-50 border rounded-lg space-y-3">
                        <h4 class="font-bold text-sm text-gray-700"><i class="fa-solid fa-lock"></i> Contraseña de Admin</h4>
                        <input type="password" id="settings-new-password" placeholder="Nueva clave" class="w-full px-3 py-1.5 border rounded text-sm">
                    </div>

                    <button onclick="saveSettingsToCloud()" class="w-full bg-custom-primary text-white py-2 rounded-lg text-sm font-bold">Guardar Ajustes</button>
                </div>

                <div class="mt-3 pt-2 border-t flex justify-between items-center text-xs text-gray-500">
                    <span>Total en inventario: <strong id="admin-total-count">0</strong></span>
                    <span class="text-emerald-700 font-semibold"><i class="fa-solid fa-cloud"></i> Nube Activa</span>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-white border-t border-gray-200 py-6 mt-12 text-center text-sm text-gray-500">
        <p>&copy; 2026 Joliee Store. Todos los derechos reservados.</p>
    </footer>

        async function loadStoreData() {
            try {
                const settingsRef = doc(db, "store_data", "settings");
                const settingsSnap = await getDoc(settingsRef);
                if (settingsSnap.exists()) {
                    storeSettings = { ...storeSettings, ...settingsSnap.data() };
                }
                applySettingsToUI();

                const prodRef = doc(db, "store_data", "products_list");
                const prodSnap = await getDoc(prodRef);
                
                if (prodSnap.exists() && Object.keys(prodSnap.data()).length > 0) {
                    const data = prodSnap.data();
                    currentProducts = Object.values(data).filter(item => typeof item === 'object' && item !== null && 'id' in item);
                } else if (fallbackProducts.length > 0) {
                    currentProducts = fallbackProducts;
                    const dataObject = {};
                    fallbackProducts.forEach((p, idx) => { dataObject[idx] = p; });
                    await setDoc(prodRef, dataObject, { merge: true });
                } else {
                    currentProducts = [];
                }
            } catch (e) {
                console.error("Error al cargar:", e);
                currentProducts = fallbackProducts;
            }
            renderCategories();
            renderProducts();
        }

        function applySettingsToUI() {
            document.documentElement.style.setProperty('--color-primary', storeSettings.primaryColor);
            document.getElementById('store-title-header').innerText = storeSettings.storeTitle;
            document.getElementById('html-title').innerText = storeSettings.storeTitle + " - Catálogo Oficial";

            const logoImg = document.getElementById('store-logo-img');
            if (storeSettings.storeLogo && storeSettings.storeLogo.trim() !== "") {
                logoImg.src = storeSettings.storeLogo;
                logoImg.classList.remove('hidden');
            } else {
                logoImg.classList.add('hidden');
            }

            document.getElementById('settings-primary-color').value = storeSettings.primaryColor;
            document.getElementById('settings-store-title').value = storeSettings.storeTitle;
            document.getElementById('settings-store-logo').value = storeSettings.storeLogo || "";
        }

        window.switchTab = function(tab) {
            if (tab === 'products') {
                document.getElementById('tab-content-products').classList.remove('hidden');
                document.getElementById('tab-content-products').classList.add('flex');
                document.getElementById('tab-content-appearance').classList.remove('flex');
                document.getElementById('tab-content-appearance').classList.add('hidden');
                document.getElementById('tab-btn-products').className = "px-4 py-2 text-sm font-bold bg-custom-primary text-white rounded-lg";
                document.getElementById('tab-btn-appearance').className = "px-4 py-2 text-sm font-bold bg-gray-200 text-gray-700 rounded-lg";
            } else {
                document.getElementById('tab-content-appearance').classList.remove('hidden');
                document.getElementById('tab-content-appearance').classList.add('flex');
                document.getElementById('tab-content-products').classList.remove('flex');
                document.getElementById('tab-content-products').classList.add('hidden');
                document.getElementById('tab-btn-appearance').className = "px-4 py-2 text-sm font-bold bg-custom-primary text-white rounded-lg";

        window.renderCategories = function() {
            const container = document.getElementById('category-filters');
            const cats = ["Todos", ...new Set(currentProducts.map(p => p.cat))];
            container.innerHTML = cats.map(cat => `
                <button onclick="setCategory('${cat}')" class="px-4 py-2 rounded-lg text-sm font-medium transition ${currentCategory === cat ? 'bg-custom-primary text-white' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}">
                    ${cat}
                </button>
            `).join('');
        }

        window.setCategory = function(cat) { currentCategory = cat; currentPage = 1; renderProducts(); renderCategories(); }
        window.filterProducts = function() { currentPage = 1; renderProducts(); }

        window.openProductDetail = function(productId) {
            const p = currentProducts.find(item => item.id === productId);
            if (!p) return;

            const imageList = (p.gallery && Array.isArray(p.gallery) && p.gallery.length > 0) ? p.gallery : [p.img];
            
            document.getElementById('detail-main-img').src = imageList[0];
            document.getElementById('detail-product-cat').innerText = p.cat;
            document.getElementById('detail-product-title').innerText = p.title;
            document.getElementById('detail-product-price').innerText = `$${p.price}`;
            document.getElementById('detail-product-desc').innerText = p.desc || "Sin descripción disponible para este producto.";
            document.getElementById('detail-product-status').innerText = p.status || "Disponible";

            const thumbsContainer = document.getElementById('detail-gallery-thumbs');
            if (imageList.length > 1) {
                thumbsContainer.innerHTML = imageList.map((imgUrl, idx) => `
                    <img src="${imgUrl}" onclick="document.getElementById('detail-main-img').src='${imgUrl}'" class="w-12 h-12 object-cover rounded-lg cursor-pointer border-2 hover:border-rose-900 transition">
                `).join('');
                thumbsContainer.classList.remove('hidden');
            } else {
                thumbsContainer.innerHTML = '';
                thumbsContainer.classList.add('hidden');
            }

            document.getElementById('product-detail-modal').classList.remove('hidden');
        }

        window.closeProductDetailModal = function() {
            document.getElementById('product-detail-modal').classList.add('hidden');
        }

        window.renderProducts = function() {
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const filtered = currentProducts.filter(p => {
                const matchesCat = currentCategory === "Todos" || p.cat === currentCategory;
                const matchesSearch = p.title.toLowerCase().includes(searchVal) || (p.desc && p.desc.toLowerCase().includes(searchVal));
                return matchesCat && matchesSearch;
            });

            const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            
            const start = (currentPage - 1) * itemsPerPage;
            const paginatedItems = filtered.slice(start, start + itemsPerPage);

            const grid = document.getElementById('products-grid');
            if (paginatedItems.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">No se encontraron productos.</div>`;
            } else {
                grid.innerHTML = paginatedItems.map(p => {
                    const imageList = (p.gallery && Array.isArray(p.gallery) && p.gallery.length > 0) ? p.gallery : [p.img];
                    const mainImage = imageList[0];
                    return `
                        <div onclick="openProductDetail(${p.id})" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col hover:shadow-lg cursor-pointer transition transform hover:-translate-y-1">
                            <div class="h-48 bg-gray-100 overflow-hidden relative">
                                <img src="${mainImage}" alt="${p.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400?text=Sin+Imagen'">
                                <span class="absolute top-2 right-2 bg-white/90 backdrop-blur-sm text-xs font-semibold px-2.5 py-1 rounded-full text-custom-primary">${p.cat}</span>
                                ${imageList.length > 1 ? '<span class="absolute bottom-2 left-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded-full"><i class="fa-regular fa-images"></i> Vistas</span>' : ''}
                            </div>
                            <div class="p-4 flex flex-col flex-grow">
                                <h3 class="font-bold text-gray-800 text-base mb-1">${p.title}</h3>
                                <p class="text-sm text-gray-500 mb-4 flex-grow line-clamp-2">${p.desc || ''}</p>
                                <div class="flex justify-between items-center mt-auto pt-3 border-t border-gray-100">
                                    <span class="text-lg font-bold text-custom-primary">$${p.price}</span>
                                    <span class="text-xs px-2 py-1 bg-emerald-50 text-emerald-700 rounded-md font-medium">${p.status || 'Disponible'}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            renderPagination(totalPages);
        }

        window.renderPagination = function(totalPages) {
            const container = document.getElementById('pagination-container');
            if (totalPages <= 1) { container.innerHTML = ''; return; }
            let html = `<button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-1 border rounded-lg"' : 'class="px-3 py-1 border rounded-lg hover:bg-gray-50"'}><i class="fa-solid fa-chevron-left"></i></button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<button onclick="changePage(${i})" class="px-3.5 py-1 rounded-lg text-sm font-semibold transition ${currentPage === i ? 'bg-custom-primary text-white' : 'border border-gray-200 text-gray-600 hover:bg-gray-50'}">${i}</button>`;
            }
            html += `<button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-1 border rounded-lg"' : 'class="px-3 py-1 border rounded-lg hover:bg-gray-50"'}><i class="fa-solid fa-chevron-right"></i></button>`;
            container.innerHTML = html;
        }

        window.changePage = function(page) { currentPage = page; renderProducts(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        window.editProduct = function(id) {
            const p = currentProducts.find(item => item.id === id);
            if (!p) return;
            document.getElementById('form-title').innerText = "Editar Producto #" + id;
            document.getElementById('form-id').value = p.id;
            document.getElementById('form-title-input').value = p.title;
            document.getElementById('form-cat-input').value = p.cat;
            document.getElementById('form-price-input').value = p.price;
            document.getElementById('form-img-input').value = p.img;
            document.getElementById('form-gallery-input').value = p.gallery ? p.gallery.join(', ') : "";
            document.getElementById('form-desc-input').value = p.desc || "";
            document.getElementById('product-form-container').classList.remove('hidden');
        }

        window.cancelProductForm = function() { document.getElementById('product-form-container').classList.add('hidden'); }

        window.saveProductToCloud = async function() {
            const id = document.getElementById('form-id').value;
            const title = document.getElementById('form-title-input').value.trim();
            const cat = document.getElementById('form-cat-input').value.trim();
            const price = document.getElementById('form-price-input').value.trim();
            const img = document.getElementById('form-img-input').value.trim();
            const galleryRaw = document.getElementById('form-gallery-input').value.trim();
            const desc = document.getElementById('form-desc-input').value.trim();

            if (!title || !price || !cat) { alert('Completa nombre, categoría y precio.'); return; }

            let gallery = [];
            if (galleryRaw) {
                gallery = galleryRaw.split(',').map(s => s.trim()).filter(s => s.length > 0);
            }
            if (gallery.length === 0 && img) gallery = [img];

            if (id) {
                const index = currentProducts.findIndex(p => p.id == id);
                if (index !== -1) currentProducts[index] = { ...currentProducts[index], title, cat, price, img, gallery, desc };
            } else {
                const newId = currentProducts.length > 0 ? Math.max(...currentProducts.map(p => Number(p.id) || 0)) + 1 : 1;
                currentProducts.unshift({ id: newId, title, cat, price, img, gallery, desc, status: "Disponible" });
            }

            try {
                const dataObject = {};
                currentProducts.forEach((p, idx) => { dataObject[idx] = p; });
                await setDoc(doc(db, "store_data", "products_list"), dataObject, { merge: true });
                alert('¡Guardado en la nube con éxito!');
                cancelProductForm();
                renderCategories();
                renderProducts();
                renderAdminProductsList();
            } catch (err) { alert('Error: ' + err.message); }
        }

        window.deleteProduct = async function(id) {
            if (confirm('¿Eliminar producto?')) {
                currentProducts = currentProducts.filter(p => p.id !== id);
                try {
                    const dataObject = {};
                    currentProducts.forEach((p, idx) => { dataObject[idx] = p; });
                    await setDoc(doc(db, "store_data", "products_list"), dataObject, { merge: true });
                    renderCategories();
                    renderProducts();
                    renderAdminProductsList();
                } catch (err) { alert('Error: ' + err.message); }
            }
        }

        window.saveSettingsToCloud = async function() {
            const newColor = document.getElementById('settings-primary-color').value;
            const newTitle = document.getElementById('settings-store-title').value.trim();
            const newLogo = document.getElementById('settings-store-logo').value.trim();
            const newPass = document.getElementById('settings-new-password').value.trim();

            storeSettings.primaryColor = newColor;
            storeSettings.storeTitle = newTitle || "Joliee Store";
            storeSettings.storeLogo = newLogo;
            if (newPass) {
                storeSettings.adminPassword = newPass;
            }

            try {
                await setDoc(doc(db, "store_data", "settings"), storeSettings, { merge: true });
                applySettingsToUI();
                alert('¡Ajustes guardados en la nube con éxito!');
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        loadStoreData();
    </script>
</body>
</html>
