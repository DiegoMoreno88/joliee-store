<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joliee Store - Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <!-- Encabezado -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 id="store-title" class="text-2xl font-bold text-rose-900">Joliee Store</h1>
                <p id="store-subtitle" class="text-sm text-gray-500">Catálogo Oficial</p>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openAdminModal()" class="p-2 text-gray-600 hover:text-rose-900 transition" title="Panel de Administración">
                    <i class="fa-solid fa-gear text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Barra de Búsqueda y Filtros -->
    <div class="max-w-7xl mx-auto px-4 mt-6 w-full">
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" oninput="filterProducts()" placeholder="Buscar por producto..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-rose-900">
            </div>
            <div id="category-filters" class="flex flex-wrap gap-2 w-full md:w-auto justify-start md:justify-end">
            </div>
        </div>
    </div>

    <!-- Catálogo -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>

        <!-- Paginación -->
        <div id="pagination-container" class="flex justify-center items-center space-x-2 mt-10">
        </div>
    </main>

    <!-- Modal de Administración Interactiva -->
    <div id="admin-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 relative max-h-[90vh] flex flex-col">
            <button onclick="closeAdminModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            
            <!-- Login -->
            <div id="admin-login-view">
                <h3 class="text-xl font-bold text-gray-800 mb-4">Acceso de Administrador</h3>
                <p class="text-sm text-gray-600 mb-4">Ingresa la contraseña para gestionar productos e imágenes.</p>
                <input type="password" id="admin-password" placeholder="Contraseña (1234)" class="w-full px-4 py-2 border border-gray-300 rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-rose-900">
                <button onclick="verifyAdminPassword()" class="w-full bg-rose-900 text-white py-2 rounded-lg hover:bg-rose-800 transition">Entrar</button>
            </div>

            <!-- Panel de Edición Activo -->
            <div id="admin-dashboard-view" class="hidden flex-col h-full overflow-hidden">
                <div class="flex justify-between items-center mb-4 pb-2 border-b">
                    <h3 class="text-xl font-bold text-rose-900">Gestión de Productos</h3>
                    <button onclick="showAddProductForm()" class="bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-emerald-600 transition flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i> Nuevo Producto
                    </button>
                </div>

                <!-- Formulario de Agregar / Editar -->
                <div id="product-form-container" class="hidden mb-4 p-4 bg-gray-50 border border-gray-200 rounded-lg">
                    <h4 id="form-title" class="font-bold text-sm text-gray-700 mb-2">Editar Producto</h4>
                    <input type="hidden" id="form-id">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-2">
                        <input type="text" id="form-title-input" placeholder="Nombre del producto" class="px-3 py-1.5 border rounded text-sm">
                        <input type="text" id="form-cat-input" placeholder="Categoría" class="px-3 py-1.5 border rounded text-sm">
                        <input type="text" id="form-price-input" placeholder="Precio ($)" class="px-3 py-1.5 border rounded text-sm">
                        <input type="text" id="form-img-input" placeholder="URL Enlace Directo ImgBB (.jpg/.png)" class="px-3 py-1.5 border rounded text-sm">
                    </div>
                    <textarea id="form-desc-input" placeholder="Descripción corta" class="w-full px-3 py-1.5 border rounded text-sm mb-2" rows="2"></textarea>
                    <div class="flex justify-end space-x-2">
                        <button onclick="cancelProductForm()" class="px-3 py-1 bg-gray-200 text-gray-700 text-xs rounded hover:bg-gray-300">Cancelar</button>
                        <button onclick="saveProductForm()" class="px-3 py-1 bg-rose-900 text-white text-xs rounded hover:bg-rose-800">Guardar Cambios</button>
                    </div>
                </div>

                <!-- Lista editable de productos -->
                <div class="overflow-y-auto flex-grow max-h-[50vh] space-y-2 pr-1">
                    <div id="admin-products-list">
                        <!-- Productos generados con botones de edición -->
                    </div>
                </div>
                
                <div class="mt-4 pt-3 border-t flex justify-between items-center text-xs text-gray-500">
                    <span>Total en inventario: <strong id="admin-total-count">0</strong></span>
                    <button onclick="resetToInitialProducts()" class="text-rose-700 hover:underline">Restablecer datos originales</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Pie de página -->
    <footer class="bg-white border-t border-gray-200 py-6 mt-12 text-center text-sm text-gray-500">
        <p>&copy; 2026 Joliee Store. Todos los derechos reservados.</p>
    </footer>

        let currentProducts = [];
        let currentCategory = "Todos";
        let currentPage = 1;
        const itemsPerPage = 24;

        function loadStoreData() {
            const savedData = localStorage.getItem('joliee_store_products');
            if (savedData) {
                try {
                    currentProducts = JSON.parse(savedData);
                } catch(e) {
                    currentProducts = initialProducts;
                }
            } else {
                currentProducts = initialProducts;
                saveToLocalStorage();
            }
            renderCategories();
            renderProducts();
        }

        function saveToLocalStorage() {
            localStorage.setItem('joliee_store_products', JSON.stringify(currentProducts));
        }

        function renderCategories() {
            const categoriesContainer = document.getElementById('category-filters');
            const cats = ["Todos", ...new Set(currentProducts.map(p => p.cat))];
            categoriesContainer.innerHTML = cats.map(cat => `
                <button onclick="setCategory('${cat}')" class="px-4 py-2 rounded-lg text-sm font-medium transition ${currentCategory === cat ? 'bg-rose-900 text-white' : 'bg-white text-gray-600 border border-gray-200 hover:bg-gray-50'}">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            currentPage = 1;
            renderProducts();
            renderCategories();
        }

        function filterProducts() {
            currentPage = 1;
            renderProducts();
        }

        function renderProducts() {
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const filtered = currentProducts.filter(p => {
                const matchesCat = currentCategory === "Todos" || p.cat === currentCategory;
                const matchesSearch = p.title.toLowerCase().includes(searchVal) || (p.desc && p.desc.toLowerCase().includes(searchVal));
                const isVisible = p.visibility !== "Ocultar";
                return matchesCat && matchesSearch && isVisible;
            });

            const totalPages = Math.ceil(filtered.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            
            const start = (currentPage - 1) * itemsPerPage;
            const paginatedItems = filtered.slice(start, start + itemsPerPage);

            const grid = document.getElementById('products-grid');
            if (paginatedItems.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">No se encontraron productos.</div>`;
            } else {
                grid.innerHTML = paginatedItems.map(p => `
                    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col hover:shadow-md transition">
                        <div class="h-48 bg-gray-100 overflow-hidden relative">
                            <img src="${p.img}" alt="${p.title}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400?text=Sin+Imagen'">
                            <span class="absolute top-2 right-2 bg-white/90 backdrop-blur-sm text-xs font-semibold px-2.5 py-1 rounded-full text-rose-900">${p.cat}</span>
                        </div>
                        <div class="p-4 flex flex-col flex-grow">
                            <h3 class="font-bold text-gray-800 text-base mb-1">${p.title}</h3>
                            <p class="text-sm text-gray-500 mb-4 flex-grow">${p.desc || ''}</p>
                            <div class="flex justify-between items-center mt-auto pt-3 border-t border-gray-100">
                                <span class="text-lg font-bold text-rose-900">$${p.price}</span>
                                <span class="text-xs px-2 py-1 bg-emerald-50 text-emerald-700 rounded-md font-medium">${p.status || 'Disponible'}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const container = document.getElementById('pagination-container');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = `
                <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-1 border rounded-lg"' : 'class="px-3 py-1 border rounded-lg hover:bg-gray-50"'}>
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                html += `
                    <button onclick="changePage(${i})" class="px-3.5 py-1 rounded-lg text-sm font-semibold transition ${currentPage === i ? 'bg-rose-900 text-white' : 'border border-gray-200 text-gray-600 hover:bg-gray-50'}">
                        ${i}
                    </button>
                `;
            }

            html += `
                <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="opacity-40 cursor-not-allowed px-3 py-1 border rounded-lg"' : 'class="px-3 py-1 border rounded-lg hover:bg-gray-50"'}>
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            `;

            container.innerHTML = html;
        }

        function changePage(page) {
            currentPage = page;
            renderProducts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- FUNCIONALIDADES DE EDICIÓN DEL PANEL ---
        function openAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
            document.getElementById('admin-password').value = '';
            document.getElementById('admin-login-view').classList.remove('hidden');
            document.getElementById('admin-dashboard-view').classList.add('hidden');
            document.getElementById('admin-dashboard-view').classList.remove('flex');
        }

        function verifyAdminPassword() {
            const pass = document.getElementById('admin-password').value;
            if (pass === "1234" || pass === "admin") {
                document.getElementById('admin-login-view').classList.add('hidden');
                document.getElementById('admin-dashboard-view').classList.remove('hidden');
                document.getElementById('admin-dashboard-view').classList.add('flex');
                renderAdminProductsList();
            } else {
                alert('Contraseña incorrecta');
            }
        }

        function renderAdminProductsList() {
            const container = document.getElementById('admin-products-list');
            document.getElementById('admin-total-count').innerText = currentProducts.length;
            
            container.innerHTML = currentProducts.map(p => `
                <div class="flex items-center justify-between p-2 bg-white border border-gray-200 rounded-lg text-sm hover:border-rose-300">
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <img src="${p.img}" class="w-10 h-10 object-cover rounded" onerror="this.src='https://via.placeholder.com/50'">
                        <div class="truncate">
                            <p class="font-bold text-gray-800 truncate">${p.title}</p>
                            <p class="text-xs text-gray-500">${p.cat} - $${p.price}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="editProduct(${p.id})" class="p-1.5 text-blue-600 hover:bg-blue-50 rounded" title="Editar">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                        <button onclick="deleteProduct(${p.id})" class="p-1.5 text-rose-600 hover:bg-rose-50 rounded" title="Eliminar">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function showAddProductForm() {
            document.getElementById('form-title').innerText = "Nuevo Producto";
            document.getElementById('form-id').value = "";
            document.getElementById('form-title-input').value = "";
            document.getElementById('form-cat-input').value = "";
            document.getElementById('form-price-input').value = "";
            document.getElementById('form-img-input').value = "";
            document.getElementById('form-desc-input').value = "";
            document.getElementById('product-form-container').classList.remove('hidden');
        }

        function editProduct(id) {
            const p = currentProducts.find(item => item.id === id);
            if (!p) return;
            document.getElementById('form-title').innerText = "Editar Producto #" + id;
            document.getElementById('form-id').value = p.id;
            document.getElementById('form-title-input').value = p.title;
            document.getElementById('form-cat-input').value = p.cat;
            document.getElementById('form-price-input').value = p.price;
            document.getElementById('form-img-input').value = p.img;
            document.getElementById('form-desc-input').value = p.desc || "";
            document.getElementById('product-form-container').classList.remove('hidden');
        }

        function cancelProductForm() {
            document.getElementById('product-form-container').classList.add('hidden');
        }

        function saveProductForm() {
            const id = document.getElementById('form-id').value;
            const title = document.getElementById('form-title-input').value.trim();
            const cat = document.getElementById('form-cat-input').value.trim();
            const price = document.getElementById('form-price-input').value.trim();
            const img = document.getElementById('form-img-input').value.trim();
            const desc = document.getElementById('form-desc-input').value.trim();

            if (!title || !price || !cat) {
                alert('Por favor completa al menos el nombre, categoría y precio.');
                return;
            }

            if (id) {
                // Actualizar existente
                const index = currentProducts.findIndex(p => p.id == id);
                if (index !== -1) {
                    currentProducts[index] = { ...currentProducts[index], title, cat, price, img, desc };
                }
            } else {
                // Crear nuevo
                const newId = currentProducts.length > 0 ? Math.max(...currentProducts.map(p => p.id)) + 1 : 1;
                currentProducts.unshift({ id: newId, title, cat, price, img, desc, status: "Disponible" });
            }

            saveToLocalStorage();
            renderCategories();
            renderProducts();
            renderAdminProductsList();
            cancelProductForm();
        }

        function deleteProduct(id) {
            if (confirm('¿Estás seguro de eliminar este producto?')) {
                currentProducts = currentProducts.filter(p => p.id !== id);
                saveToLocalStorage();
                renderCategories();
                renderProducts();
                renderAdminProductsList();
            }
        }

        function resetToInitialProducts() {
            if (confirm('¿Deseas restablecer el catálogo a la lista original de 220 productos del archivo?')) {
                currentProducts = [...initialProducts];
                saveToLocalStorage();
                renderCategories();
                renderProducts();
                renderAdminProductsList();
            }
        }

        window.onload = loadStoreData;
    </script>
</body>
