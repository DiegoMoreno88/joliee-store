<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Joliee Store - Catálogo Oficial</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #800020;
      --bg: #f8f6f6;
      --surface: #ffffff;
      --text: #2b2b2b;
      --text-muted: #666666;
      --border: #e8e3e3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 60px; transition: background-color 0.3s, color 0.3s; }
    
    header { background: var(--surface); padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: relative; }
    .header-brand { display: flex; align-items: center; gap: 15px; }
    .logo-img { height: 95px; width: 95px; border-radius: 12px; object-fit: cover; display: none; border: 1px solid var(--border); box-shadow: 0 2px 6px rgba(0,0,0,0.06); background: #fff; }
    .store-info { display: flex; flex-direction: column; }
    .store-name { font-size: 26px; font-weight: 700; color: var(--primary); line-height: 1.2; }
    .store-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

    .admin-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); transition: transform 0.2s; }
    .admin-btn:hover { transform: scale(1.05); }

    .container { max-width: 1000px; margin: 0 auto; padding: 20px 15px; }
    .search-box { width: 100%; padding: 12px 18px; border-radius: 25px; border: 1px solid var(--border); font-size: 15px; outline: none; margin-bottom: 15px; background: var(--surface); color: var(--text); }
    .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scrollbar-width: none; }
    .cat-chip { padding: 8px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; font-size: 14px; cursor: pointer; white-space: nowrap; font-weight: 500; color: var(--text); }
    .cat-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; }
    .card { background: var(--surface); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; position: relative; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
    .card-img-container { position: relative; width: 100%; height: 210px; background: #eee; }
    .card-img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge-status { position: absolute; top: 8px; left: 8px; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; z-index: 2; }
    .badge-available { background: #25d366; color: white; }
    .badge-soldout { background: #ff4d4d; color: white; }
    
    .card-content { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
    .card-cat { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; line-height: 1.3; color: var(--text); }
    .card-price { font-size: 18px; font-weight: 700; color: var(--primary); }
    
    .btn-ws { background: #25d366; color: white; text-decoration: none; padding: 12px; border-radius: 8px; text-align: center; font-weight: 600; font-size: 15px; display: block; border: none; width: 100%; cursor: pointer; }
    .btn-ws.disabled { background: #ccc; pointer-events: none; }
    
    .pagination-container { margin-top: 35px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .pagination-info-row { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 480px; font-size: 14px; color: var(--text-muted); padding: 0 4px; }
    .per-page-select { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; color: var(--text); outline: none; cursor: pointer; font-weight: 500; }
    .pagination-bar { display: inline-flex; background: #e8e8e8; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    .page-btn { padding: 8px 16px; border: none; background: #e8e8e8; border-right: 1px solid #d0d0d0; font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; transition: background 0.2s, color 0.2s; display: flex; align-items: center; justify-content: center; min-width: 42px; min-height: 38px; }
    .page-btn:last-child { border-right: none; }
    .page-btn:hover:not(.active):not(:disabled) { background: #dcdcdc; }
    .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    .page-btn:disabled { color: #aaa; cursor: not-allowed; background: #e0e0e0; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; padding: 15px; }
    .modal-content { background: var(--surface); color: var(--text); width: 100%; max-width: 580px; max-height: 90vh; border-radius: 16px; overflow-y: auto; padding: 25px; position: relative; border: 1px solid var(--border); }
    .close-btn { position: absolute; right: 20px; top: 20px; font-size: 26px; border: none; background: none; cursor: pointer; color: var(--text-muted); z-index: 10; }
    
    .detail-img-box { position: relative; width: 100%; background: #f0f0f0; border-radius: 12px; overflow: hidden; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; }
    .detail-img { width: 100%; max-height: 340px; object-fit: contain; display: block; margin: 0 auto; }
    
    /* Contenedor de miniaturas para múltiples imágenes */
    .detail-thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 15px; }
    .thumb-img { width: 55px; height: 55px; border-radius: 8px; object-fit: cover; border: 2px solid var(--border); cursor: pointer; opacity: 0.7; transition: all 0.2s; }
    .thumb-img.active { border-color: var(--primary); opacity: 1; transform: scale(1.05); }

    .detail-cat { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
    .detail-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .detail-price { font-size: 24px; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
    .detail-desc-box { background: var(--bg); padding: 12px; border-radius: 8px; font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; border: 1px solid var(--border); }

    .admin-form-group { margin-bottom: 14px; }
    .admin-form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
    .admin-input, .admin-select, .admin-textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; outline: none; }
    .admin-btn-primary { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; width: 100%; cursor: pointer; font-size: 15px; margin-top: 10px; }
    .admin-btn-danger { background: #ff4d4d; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px; }
  </style>
</head>
<body>

  <header>
    <div class="header-brand">
      <img id="store-logo" class="logo-img" src="" alt="Logo">
      <div class="store-info">
        <div id="display-title" class="store-name">Joliee Store</div>
        <div id="display-sub" class="store-sub">Catálogo Oficial</div>
      </div>
    </div>
    <button class="admin-btn" onclick="requestAdminAccess()" title="Acceso Administrador">⚙️</button>
  </header>

  <div class="container">
    <input type="text" id="search-input" class="search-box" placeholder="Buscar por producto..." oninput="onSearchOrCatChange()">
    <div class="categories-bar" id="cat-chips"></div>
    <div class="products-grid" id="catalog-grid"></div>

    <div class="pagination-container" id="pagination-section">
      <div class="pagination-info-row">
        <span id="pagination-info-text">Mostrando 1–24 de 0</span>
        <select class="per-page-select" id="per-page-select" onchange="changePerPage(this.value)">
          <option value="12">Mostrar 12</option>
          <option value="24" selected>Mostrar 24</option>
          <option value="48">Mostrar 48</option>
          <option value="all">Mostrar Todos</option>
        </select>
      </div>
      <div class="pagination-bar" id="pagination-controls"></div>
    </div>
  </div>

  <!-- Modal Detalle del Producto (con Galería de Imágenes) -->
  <div class="modal" id="product-detail-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeProductDetail()">&times;</button>
      <div class="detail-img-box">
        <div id="detail-badge" style="position:absolute; top:10px; left:10px; z-index:5;"></div>
        <img id="detail-img" class="detail-img" src="" alt="Producto">
      </div>
      <div id="detail-thumbs" class="detail-thumbs"></div>
      <div id="detail-cat" class="detail-cat"></div>
      <h2 id="detail-title" class="detail-title"></h2>
      <div id="detail-price" class="detail-price"></div>
      <div style="font-size: 13px; font-weight: 600; margin-bottom: 6px;">Descripción:</div>
      <div id="detail-desc" class="detail-desc-box"></div>
      <a id="detail-ws-btn" href="#" class="btn-ws" target="_blank">Pedir por WhatsApp</a>
    </div>
  </div>

  <!-- Modal Autenticación / Clave -->
  <div class="modal" id="auth-modal">
    <div class="modal-content" style="max-width: 400px;">
      <button class="close-btn" onclick="closeAuthModal()">&times;</button>
      <h2 style="margin-bottom: 15px; font-size: 18px; color: var(--primary);">Acceso Administrativo</h2>
      <div class="admin-form-group">
        <label>Introduce la Contraseña:</label>
        <input type="password" id="auth-password-input" class="admin-input" placeholder="Clave de acceso">
      </div>
      <button class="admin-btn-primary" onclick="verifyPassword()">Ingresar</button>
    </div>
  </div>

  <!-- Modal Panel de Control -->
  <div class="modal" id="admin-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeAdminModal()">&times;</button>
      <h2 style="margin-bottom: 20px; font-size: 20px; color: var(--primary);">Panel de Administración</h2>
      
      <div style="margin-bottom: 20px; display: flex; gap: 10px;">
        <button class="admin-btn-primary" style="margin-top:0;" onclick="openAddProductModal()">+ Agregar Producto</button>
        <button class="admin-btn-primary" style="margin-top:0; background:#444;" onclick="openManageProductsModal()">Gestionar Productos</button>
      </div>

      <hr style="border:0; border-top:1px solid var(--border); margin: 20px 0;">

      <h3 style="font-size: 16px; margin-bottom: 12px;">Ajustes de la Tienda</h3>
      <div class="admin-form-group">
        <label>Nombre de la Tienda</label>
        <input type="text" id="adm-setting-title" class="admin-input">
      </div>
      <div class="admin-form-group">
        <label>Número de WhatsApp (ej: 584121234567)</label>
        <input type="text" id="adm-setting-phone" class="admin-input">
      </div>
      <div class="admin-form-group">
        <label>URL del Logo</label>
        <input type="text" id="adm-setting-logo" class="admin-input">
      </div>
      <div class="admin-form-group">
        <label>Cambiar Contraseña de la Tuerca</label>
        <input type="password" id="adm-setting-pass" class="admin-input" placeholder="Escribe nueva clave">
      </div>
      <button class="admin-btn-primary" onclick="saveSettings()">Guardar Ajustes</button>
    </div>
  </div>

  <!-- Modal Agregar / Editar Producto -->
  <div class="modal" id="edit-product-modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeEditProductModal()">&times;</button>
      <h2 id="edit-modal-title" style="margin-bottom: 15px; font-size: 18px;">Nuevo Producto</h2>
      <input type="hidden" id="edit-prod-id">
      <div class="admin-form-group">
        <label>Título del Producto</label>
        <input type="text" id="edit-prod-title" class="admin-input">
      </div>
      <div class="admin-form-group">
        <label>Categoría</label>
        <select id="edit-prod-cat" class="admin-select"></select>
      </div>
      <div class="admin-form-group">
        <label>Precio ($)</label>
        <input type="text" id="edit-prod-price" class="admin-input">
      </div>
      <div class="admin-form-group">
        <label>URLs de Imágenes (Pega varios enlaces web separados por comas ,)</label>
        <textarea id="edit-prod-img" class="admin-textarea" rows="3" placeholder="https://imagen1.jpg, https://imagen2.jpg"></textarea>
      </div>
      <div class="admin-form-group">
        <label>Estado</label>
        <select id="edit-prod-status" class="admin-select">
          <option value="Disponible">Disponible</option>
          <option value="Agotado">Agotado</option>
        </select>
      </div>
      <div class="admin-form-group">
        <label>Visibilidad</label>
        <select id="edit-prod-visibility" class="admin-select">
          <option value="Mostrar">Mostrar</option>
          <option value="Ocultar">Ocultar</option>
        </select>
      </div>
      <div class="admin-form-group">
        <label>Descripción</label>
        <textarea id="edit-prod-desc" class="admin-textarea" rows="3"></textarea>
      </div>
      <button class="admin-btn-primary" onclick="saveProductData()">Guardar Producto</button>
    </div>
  </div>

  <!-- Modal Listado de Gestión -->
  <div class="modal" id="manage-products-modal">
    <div class="modal-content" style="max-width: 700px;">
      <button class="close-btn" onclick="closeManageProductsModal()">&times;</button>
      <h2 style="margin-bottom: 15px; font-size: 18px;">Lista de Productos</h2>
      <div id="manage-products-list" style="max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;"></div>
    </div>
  </div>

  <script>
    let defaultCategories = [
      "Todos", "Cuidado Facial", "Splash, Cremas, Perfumes", "Labiales", 
      "Cejas y Pestañas", "Bases y Correctores", "Polvos y Rubores", 
      "Iluminadores y Contornos", "Cabello", "Accesorios y Brochas",
      "Rimel y Delineadores", "Primers y Selladores", "Mascarilla", 
      "Termos", "Relojes", "Paleta de Sombras"
    ];

    let storeData = {
      categories: JSON.parse(localStorage.getItem('js_cats_v99')) || defaultCategories,
      products: JSON.parse(localStorage.getItem('js_prods_v99')) || [],
      settings: JSON.parse(localStorage.getItem('js_settings_v99')) || {
        title: "Joliee Store", 
        sub: "Catálogo Oficial", 
        logo: "https://i.ibb.co/689L53H/joliee-store-logo.png", 
        phone: "", 
        primary: "#800020", 
        bg: "#f8f6f6", 
        surface: "#ffffff", 
        text: "#2b2b2b", 
        textMuted: "#666666",
        pass: "1234"
      },
      activeCat: "Todos", 
      currentPage: 1, 
      itemsPerPage: 24
    };

    function init() { applySettings(); renderCategories(); renderCatalog(); }

    function applySettings() {
      const s = storeData.settings;
      document.getElementById('display-title').innerText = s.title || "Joliee Store";
      document.getElementById('display-sub').innerText = s.sub || "";
      document.getElementById('page-title').innerText = s.title || "Joliee Store";
      const logoEl = document.getElementById('store-logo');
      if (s.logo) { logoEl.src = s.logo; logoEl.style.display = "block"; } else { logoEl.style.display = "none"; }
      document.documentElement.style.setProperty('--primary', s.primary || '#800020');
    }

    // Manejo de Seguridad y Contraseña
    function requestAdminAccess() {
      document.getElementById('auth-password-input').value = "";
      document.getElementById('auth-modal').style.display = 'flex';
    }

    function closeAuthModal() {
      document.getElementById('auth-modal').style.display = 'none';
    }

    function verifyPassword() {
      const currentPass = storeData.settings.pass || "1234";
      const entered = document.getElementById('auth-password-input').value;
      if (entered === currentPass) {
        closeAuthModal();
        openAdminModal();
      } else {
        alert("Contraseña incorrecta.");
      }
    }

    function renderCategories() {
      const bar = document.getElementById('cat-chips');
      if (!bar) return; bar.innerHTML = "";
      storeData.categories.forEach(cat => {
        const chip = document.createElement('button');
        chip.className = `cat-chip ${storeData.activeCat === cat ? 'active' : ''}`;
        chip.innerText = cat;
        chip.onclick = () => { storeData.activeCat = cat; storeData.currentPage = 1; renderCategories(); renderCatalog(); };
        bar.appendChild(chip);
      });
    }

    function onSearchOrCatChange() { storeData.currentPage = 1; renderCatalog(); }
    function changePerPage(val) { storeData.itemsPerPage = val === 'all' ? 999999 : parseInt(val); storeData.currentPage = 1; renderCatalog(); }

    function renderCatalog() {
      const grid = document.getElementById('catalog-grid');
      const search = document.getElementById('search-input')?.value.toLowerCase() || "";
      if (!grid) return; grid.innerHTML = "";

      const visibleProducts = storeData.products.filter(p => (p.visibility || "Mostrar") === "Mostrar");
      const filtered = visibleProducts.filter(p => {
        const matchCat = storeData.activeCat === "Todos" || p.cat === storeData.activeCat;
        const matchSearch = p.title.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });

      const totalItems = filtered.length;
      const itemsPerPage = storeData.itemsPerPage;
      const totalPages = Math.ceil(totalItems / itemsPerPage) || 1;
      if (storeData.currentPage > totalPages) storeData.currentPage = totalPages;
      const startIndex = (storeData.currentPage - 1) * itemsPerPage;
      const endIndex = Math.min(startIndex + itemsPerPage, totalItems);
      const paginatedItems = filtered.slice(startIndex, endIndex);

      paginatedItems.forEach(p => {
        const card = document.createElement('div');
        card.className = "card";
        card.onclick = () => openProductDetail(p.id);
        const isAgotado = p.status === "Agotado";
        const badgeHtml = isAgotado ? `<span class="badge-status badge-soldout">Agotado</span>` : `<span class="badge-status badge-available">Disponible</span>`;
        
        let firstImg = p.img || "";
        if(firstImg.includes(',')) {
          firstImg = firstImg.split(',')[0].trim();
        }

        card.innerHTML = `
          <div class="card-img-container">${badgeHtml}<img src="${firstImg}" class="card-img" alt="${p.title}"></div>
          <div class="card-content">
            <span class="card-cat">${p.cat}</span>
            <div class="card-title">${p.title}</div>
            <div class="card-price">$${p.price}</div>
          </div>
        `;
        grid.appendChild(card);
      });
      renderPaginationControls(totalItems, startIndex, endIndex, totalPages);
    }

    function renderPaginationControls(totalItems, startIndex, endIndex, totalPages) {
      const infoText = document.getElementById('pagination-info-text');
      const controlsBox = document.getElementById('pagination-controls');
      if (totalItems === 0) { infoText.innerText = "Mostrando 0 de 0 productos"; controlsBox.innerHTML = ""; return; }
      infoText.innerText = `Mostrando ${startIndex + 1}–${endIndex} de ${totalItems}`;
      if (totalPages <= 1) { controlsBox.innerHTML = `<button class="page-btn active">1</button>`; return; }
      let html = `<button class="page-btn" ${storeData.currentPage === 1 ? 'disabled' : ''} onclick="goToPage(${storeData.currentPage - 1})">&lt;</button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn ${i === storeData.currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" ${storeData.currentPage === totalPages ? 'disabled' : ''} onclick="goToPage(${storeData.currentPage + 1})">&gt;</button>`;
      controlsBox.innerHTML = html;
    }

    function goToPage(p) { storeData.currentPage = p; renderCatalog(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

    function openProductDetail(id) {
      const p = storeData.products.find(item => item.id === id);
      if (!p) return;

      let imgList = [];
      if(p.img) {
        imgList = p.img.split(',').map(url => url.trim()).filter(url => url.length > 0);
      }
      if(imgList.length === 0) imgList = ["https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400"];

      const mainImgEl = document.getElementById('detail-img');
      mainImgEl.src = imgList[0];

      const thumbsContainer = document.getElementById('detail-thumbs');
      thumbsContainer.innerHTML = "";
      if(imgList.length > 1) {
        thumbsContainer.style.display = "flex";
        imgList.forEach((url, idx) => {
          const thumb = document.createElement('img');
          thumb.src = url;
          thumb.className = `thumb-img ${idx === 0 ? 'active' : ''}`;
          thumb.onclick = () => {
            mainImgEl.src = url;
            document.querySelectorAll('.thumb-img').forEach(t => t.classList.remove('active'));
            thumb.classList.add('active');
          };
          thumbsContainer.appendChild(thumb);
        });
      } else {
        thumbsContainer.style.display = "none";
      }

      document.getElementById('detail-cat').innerText = p.cat;
      document.getElementById('detail-title').innerText = p.title;
      document.getElementById('detail-price').innerText = '$' + p.price;
      document.getElementById('detail-desc').innerText = p.desc || 'Sin descripción disponible.';
      
      const isAgotado = p.status === "Agotado";
      document.getElementById('detail-badge').innerHTML = isAgotado ? `<span class="badge-status badge-soldout">Agotado</span>` : `<span class="badge-status badge-available">Disponible</span>`;
      
      const wsBtn = document.getElementById('detail-ws-btn');
      const phone = storeData.settings.phone || "";
      if (isAgotado) { 
        wsBtn.className = "btn-ws disabled"; 
        wsBtn.href = "#"; 
        wsBtn.innerText = "Producto Agotado"; 
      } else { 
        wsBtn.className = "btn-ws"; 
        wsBtn.href = `https://wa.me/${phone}?text=${encodeURIComponent('Hola! Me interesa: ' + p.title + ' ($' + p.price + ')')}`; 
        wsBtn.innerText = "Pedir por WhatsApp"; 
      }
      document.getElementById('product-detail-modal').style.display = 'flex';
    }

    function closeProductDetail() { document.getElementById('product-detail-modal').style.display = 'none'; }

    function openAdminModal() {
      document.getElementById('adm-setting-title').value = storeData.settings.title || "";
      document.getElementById('adm-setting-phone').value = storeData.settings.phone || "";
      document.getElementById('adm-setting-logo').value = storeData.settings.logo || "";
      document.getElementById('adm-setting-pass').value = storeData.settings.pass || "1234";
      document.getElementById('admin-modal').style.display = 'flex';
    }
    function closeAdminModal() { document.getElementById('admin-modal').style.display = 'none'; }

    function saveSettings() {
      storeData.settings.title = document.getElementById('adm-setting-title').value;
      storeData.settings.phone = document.getElementById('adm-setting-phone').value;
      storeData.settings.logo = document.getElementById('adm-setting-logo').value;
      const newPass = document.getElementById('adm-setting-pass').value;
      if (newPass && newPass.trim() !== "") {
        storeData.settings.pass = newPass.trim();
      }
      localStorage.setItem('js_settings_v99', JSON.stringify(storeData.settings));
      applySettings();
      closeAdminModal();
      alert('¡Ajustes y contraseña guardados con éxito!');
    }

    function openAddProductModal() {
      document.getElementById('edit-modal-title').innerText = "Nuevo Producto";
      document.getElementById('edit-prod-id').value = "";
      document.getElementById('edit-prod-title').value = "";
      document.getElementById('edit-prod-price').value = "";
      document.getElementById('edit-prod-img').value = "";
      document.getElementById('edit-prod-desc').value = "";
      
      const catSelect = document.getElementById('edit-prod-cat');
      catSelect.innerHTML = "";
      storeData.categories.forEach(c => { if(c !== "Todos") catSelect.innerHTML += `<option value="${c}">${c}</option>`; });
      
      closeAdminModal();
      document.getElementById('edit-product-modal').style.display = 'flex';
    }

    function closeEditProductModal() { document.getElementById('edit-product-modal').style.display = 'none'; }

    function saveProductData() {
      const idVal = document.getElementById('edit-prod-id').value;
      const title = document.getElementById('edit-prod-title').value;
      const cat = document.getElementById('edit-prod-cat').value;
      const price = document.getElementById('edit-prod-price').value;
      const img = document.getElementById('edit-prod-img').value;
      const status = document.getElementById('edit-prod-status').value;
      const visibility = document.getElementById('edit-prod-visibility').value;
      const desc = document.getElementById('edit-prod-desc').value;

      if(!title || !price) { alert('Por favor completa al menos el título y el precio.'); return; }

      if(idVal) {
        const prod = storeData.products.find(p => p.id == idVal);
        if(prod) { prod.title = title; prod.cat = cat; prod.price = price; prod.img = img; prod.status = status; prod.visibility = visibility; prod.desc = desc; }
      } else {
        const newId = storeData.products.length > 0 ? Math.max(...storeData.products.map(p => p.id)) + 1 : 101;
        storeData.products.unshift({ id: newId, title, cat, price, img, status, visibility, desc });
      }

      localStorage.setItem('js_prods_v99', JSON.stringify(storeData.products));
      closeEditProductModal();
      renderCatalog();
      alert('¡Producto guardado localmente!');
    }

    function openManageProductsModal() {
      closeAdminModal();
      const listContainer = document.getElementById('manage-products-list');
      listContainer.innerHTML = "";
      storeData.products.forEach(p => {
        let firstImg = p.img || "";
        if(firstImg.includes(',')) firstImg = firstImg.split(',')[0].trim();

        const item = document.createElement('div');
        item.style.cssText = "display:flex; justify-content:space-between; align-items:center; background:var(--bg); padding:10px; border-radius:8px; border:1px solid var(--border);";
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:10px;">
            <img src="${firstImg}" style="width:40px; height:40px; object-fit:cover; border-radius:4px;">
            <div>
              <div style="font-size:14px; font-weight:600;">${p.title}</div>
              <div style="font-size:12px; color:var(--text-muted);">$${p.price} - ${p.status}</div>
            </div>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="admin-btn-primary" style="margin-top:0; padding:6px 10px; font-size:12px;" onclick="editProduct(${p.id})">Editar</button>
            <button class="admin-btn-danger" onclick="deleteProduct(${p.id})">Eliminar</button>
          </div>
        `;
        listContainer.appendChild(item);
      });
      document.getElementById('manage-products-modal').style.display = 'flex';
    }

    function closeManageProductsModal() { document.getElementById('manage-products-modal').style.display = 'none'; }

    function editProduct(id) {
      const p = storeData.products.find(item => item.id === id);
      if(!p) return;
      closeManageProductsModal();
      document.getElementById('edit-modal-title').innerText = "Editar Producto";
      document.getElementById('edit-prod-id').value = p.id;
      document.getElementById('edit-prod-title').value = p.title;
      document.getElementById('edit-prod-price').value = p.price;
      document.getElementById('edit-prod-img').value = p.img || "";
      document.getElementById('edit-prod-status').value = p.status || "Disponible";
      document.getElementById('edit-prod-visibility').value = p.visibility || "Mostrar";
      document.getElementById('edit-prod-desc').value = p.desc || "";

      const catSelect = document.getElementById('edit-prod-cat');
      catSelect.innerHTML = "";
      storeData.categories.forEach(c => { if(c !== "Todos") catSelect.innerHTML += `<option value="${c}" ${c === p.cat ? 'selected' : ''}>${c}</option>`; });

      document.getElementById('edit-product-modal').style.display = 'flex';
    }

    function deleteProduct(id) {
      if(confirm('¿Estás seguro de que deseas eliminar este producto?')) {
        storeData.products = storeData.products.filter(p => p.id !== id);
        localStorage.setItem('js_prods_v99', JSON.stringify(storeData.products));
        openManageProductsModal();
        renderCatalog();
      }
    }

    init();
  </script>
</body>
</html>
